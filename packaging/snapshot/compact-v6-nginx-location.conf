# Keep the shared /snapshot/ endpoint compatible with legacy clients.
# Insert this location inside the seed's existing HTTPS server block.
location /snapshot/compact-v6/ {
    alias /var/www/dinero-snapshots/compact-v6/latest/;
    autoindex off;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;
}
