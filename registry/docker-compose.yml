version: '3.8'

services:
  # Basic registry without self-registration
  registry-basic:
    build: .
    container_name: dinero-registry-basic
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - TZ=UTC
    command: >
      python3 dinero_registry.py
      --port 8080
      --interval 60
      --timeout 5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/status"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - basic

  # Extended registry with self-registration
  registry-extended:
    build: .
    container_name: dinero-registry-extended
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - TZ=UTC
      - REGISTRY_SECRET=${REGISTRY_SECRET:-}  # Set via .env file or env var
    command: >
      python3 dinero_registry_extended.py
      --port 8080
      --interval 60
      --timeout 5
      --max-nodes 100
      ${REGISTRY_SECRET:+--secret $REGISTRY_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/status"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - extended

  # Nginx reverse proxy (optional, for HTTPS)
  nginx:
    image: nginx:alpine
    container_name: dinero-registry-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - registry-extended
    restart: unless-stopped
    profiles:
      - production

# Usage:
#
# Basic registry:
#   docker-compose --profile basic up -d
#
# Extended registry with registration:
#   docker-compose --profile extended up -d
#
# Production with nginx + SSL:
#   docker-compose --profile production up -d
#
# View logs:
#   docker-compose logs -f
#
# Stop:
#   docker-compose down
