name: Wallet v3 exact-head Windows qualification

# Disposable CI branch only. This workflow runs no signing, packaging, release,
# deployment, or artifact upload. It checks out the immutable #917 product SHA.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wallet-v3-msvc:
    name: Windows MSVC x64 wallet v3 focused
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    env:
      V3_SOURCE_SHA: 267aa660e9f20b4c363bb36853be3ab23e665c59
      BUILD_DIR: build-v3-msvc
    steps:
      - name: Checkout exact #917 product source
        uses: actions/checkout@v4
        with:
          ref: 267aa660e9f20b4c363bb36853be3ab23e665c59
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Assert immutable product source
        run: |
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "Product source: $actual"
          if ($actual -ne $env:V3_SOURCE_SHA) { throw "Expected #917 source $env:V3_SOURCE_SHA; got $actual" }
          if ((git status --porcelain).Length -ne 0) { throw 'Product checkout is dirty' }

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install CMake and Ninja
        run: |
          python -m pip install --disable-pip-version-check 'cmake==4.3.4' 'ninja==1.13.2'
          if ($LASTEXITCODE -ne 0) { throw 'CMake/Ninja install failed' }
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $scripts | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PATH = $scripts + [IO.Path]::PathSeparator + $env:PATH
          cmake --version
          ninja --version

      - name: Install Qt 6.9.1 MSVC 2022 x64
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '6.9.1'
          arch: win64_msvc2022_64
          cache: true

      - name: Install source-pinned Rust compiler
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable

      - name: Prepare Orchard compiler
        run: |
          $pin = python -c "import tomllib; print(tomllib.load(open('rust/orchard_backend/rust-toolchain.toml','rb'))['toolchain']['channel'])"
          if ($LASTEXITCODE -ne 0 -or -not $pin) { throw 'Orchard Rust pin missing' }
          rustup toolchain install "$pin" --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Orchard Rust install failed' }
          rustc "+$pin" -vV

      - name: Build vendored OpenSSL 3.5.7
        shell: powershell
        run: |
          $env:OPENSSL_VERSION = '3.5.7'
          .\scripts\build-openssl-vendored.ps1
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL build failed' }

      - name: Build vendored static curl
        shell: powershell
        run: |
          $env:OPENSSL_VERSION = '3.5.7'
          .\scripts\build-curl-vendored.ps1
          if ($LASTEXITCODE -ne 0) { throw 'curl build failed' }

      - name: Provision vcpkg curl
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install curl:x64-windows --no-print-usage
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg curl install failed' }

      - name: Configure focused MSVC Orchard and Qt build
        run: |
          cmake -S . -B $env:BUILD_DIR -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DDINERO_USE_VENDORED_DEPS=ON `
            -DDINERO_BUILD_ORCHARD_BACKEND=ON `
            -DDINERO_ORCHARD_WINDOWS_QUALIFICATION=ON `
            -DDINERO_BUILD_QT=ON `
            -DDIN_ENABLE_ORCHARD_UI=ON `
            -DENABLE_TESTS=ON -DBUILD_TESTING=ON `
            -DENABLE_GPU_MINING=OFF -DMINER_ENABLE_CUDA=OFF `
            -DENABLE_HARDWARE_WALLETS=OFF -DENABLE_GRPC=OFF `
            -DDINERO_ENABLE_PORTMAPPING=OFF -DDINERO_ENABLE_QUIC=OFF `
            -DDINERO_BUILD_MINER=OFF -DDINERO_BUILD_SEEDER=OFF `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Focused CMake configure failed' }
          Select-String -Path "$env:BUILD_DIR\CMakeCache.txt" -Pattern '^(DINERO_BUILD_ORCHARD_BACKEND|DINERO_BUILD_QT|DINERO_ORCHARD_WINDOWS_QUALIFICATION):' | ForEach-Object { $_.Line }

      - name: Build focused daemon and test targets
        run: |
          cmake --build $env:BUILD_DIR --parallel 2 --target dinerod test_assumeutxo_replay test_wallet_layout
          if ($LASTEXITCODE -ne 0) { throw 'Focused Windows MSVC build failed' }

      - name: Prove focused CTests are registered
        run: |
          $names = @('WalletV3Spend', 'WalletV3RecoveryRoute', 'WalletLayout')
          $inventory = (ctest --test-dir $env:BUILD_DIR -N -R '^(WalletV3Spend|WalletV3RecoveryRoute|WalletLayout)$' 2>&1) -join "`n"
          Write-Host $inventory
          if ($LASTEXITCODE -ne 0) { throw 'CTest inventory failed' }
          foreach ($name in $names) {
            if ($inventory -notmatch "(?m)Test +#\d+: $name(?:\s|$)") { throw "CTest missing $name" }
          }

      - name: Run WalletV3Spend WalletV3RecoveryRoute WalletLayout
        run: |
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = "$env:QT_ROOT_DIR\plugins\platforms"
          ctest --test-dir $env:BUILD_DIR --no-tests=error --output-on-failure -j 1 -R '^(WalletV3Spend|WalletV3RecoveryRoute|WalletLayout)$'
          if ($LASTEXITCODE -ne 0) { throw 'Focused wallet v3 Windows CTests failed' }
