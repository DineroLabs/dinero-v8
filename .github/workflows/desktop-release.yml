name: Desktop Release Assets

# Manually rebuild user-facing desktop packages from an immutable release tag.
# The workflow definition and packaging helpers may be newer than that tag, so
# every run records both identities and builds all product binaries exclusively
# from the requested tag checkout.

on:
  pull_request:
    branches: [dinero-main]
    paths:
      - '.github/workflows/desktop-release.yml'
      - 'packaging/linux/build-qt-deb.sh'
      - 'packaging/linux/build-qt-tarball.sh'
      - 'packaging/mac/assert-v8-release-lane.sh'
      - 'packaging/mac/build-installer.sh'
      - 'packaging/mac/sign-notarize-release.sh'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Immutable Dinero release tag to package'
        required: true
        default: 'v8.1.8'
        type: string

permissions:
  # Draft releases are intentionally used as the staging area for verified
  # snapshot inputs. GitHub returns 404 for draft releases to tokens without
  # push access, so the packaging jobs need write-level contents permission
  # even though this workflow only downloads those assets.
  contents: write

concurrency:
  group: desktop-release-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  SV2_REF: 391d93df3450df6a58f119dec2b3fe35a1066e44
  LINUXDEPLOY_TAG: 1-alpha-20251107-1
  LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
  LINUXDEPLOY_QT_TAG: 1-alpha-20250213-1
  LINUXDEPLOY_QT_SHA256: 15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724

jobs:
  tooling-contract:
    name: Desktop release tooling contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout tooling under review
        uses: actions/checkout@v4

      - name: Validate shell entrypoints and architecture contract
        run: |
          set -euo pipefail
          bash -n \
            packaging/linux/build-qt-deb.sh \
            packaging/linux/build-qt-tarball.sh \
            packaging/mac/assert-v8-release-lane.sh \
            packaging/mac/build-installer.sh \
            packaging/mac/sign-notarize-release.sh
          for script in packaging/mac/build-installer.sh packaging/mac/sign-notarize-release.sh; do
            set +e
            output=$("$script" --arch powerpc --version 0.0.0-test 2>&1)
            rc=$?
            set -e
            [ "$rc" -eq 2 ]
            grep -Fq 'unsupported macOS release architecture: powerpc' <<<"$output"
          done
          grep -Fq 'macOS-${ARCH}.dmg' packaging/mac/build-installer.sh
          grep -Fq 'macOS-${ARCH}.dmg' packaging/mac/sign-notarize-release.sh
          grep -Fq 'Developer ID Application: DineroLabs LLC (JXJS6ZA5FJ)' \
            packaging/mac/sign-notarize-release.sh
          grep -Fq 'expected-repo-head' packaging/mac/assert-v8-release-lane.sh

  linux-desktop:
    name: Linux x86_64 — Qt desktop packages
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    defaults:
      run:
        working-directory: source

    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          path: source
          submodules: recursive
          fetch-depth: 1

      - name: Checkout reviewed release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 1

      - name: Checkout pinned SV2 miners
        uses: actions/checkout@v4
        with:
          repository: DineroLabs/dinero-sv2
          ref: ${{ env.SV2_REF }}
          path: dinero-sv2
          fetch-depth: 1

      - name: Record provenance
        id: provenance
        run: |
          set -euo pipefail
          test "$(git describe --tags --exact-match HEAD)" = "${{ inputs.release_tag }}"
          SOURCE_HEAD=$(git rev-parse HEAD)
          TOOLING_HEAD=$(git -C "${GITHUB_WORKSPACE}/tooling" rev-parse HEAD)
          SV2_HEAD=$(git -C "${GITHUB_WORKSPACE}/dinero-sv2" rev-parse HEAD)
          test "$TOOLING_HEAD" = "$GITHUB_SHA"
          test "$SV2_HEAD" = "$SV2_REF"
          V="${{ inputs.release_tag }}"; V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "source_head=$SOURCE_HEAD" >> "$GITHUB_OUTPUT"
          echo "tooling_head=$TOOLING_HEAD" >> "$GITHUB_OUTPUT"
          {
            echo "release_tag=${{ inputs.release_tag }}"
            echo "source_commit=$SOURCE_HEAD"
            echo "tooling_commit=$TOOLING_HEAD"
            echo "sv2_commit=$SV2_HEAD"
            echo "runner=${RUNNER_OS} ${RUNNER_ARCH}"
          } | tee desktop-release-provenance-linux.txt

      - name: Overlay reviewed Linux packaging helpers
        run: |
          cp "${GITHUB_WORKSPACE}/tooling/packaging/linux/build-qt-deb.sh" packaging/linux/
          cp "${GITHUB_WORKSPACE}/tooling/packaging/linux/build-qt-tarball.sh" packaging/linux/
          chmod +x packaging/linux/build-qt-deb.sh packaging/linux/build-qt-tarball.sh

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 perl curl file patchelf \
            libcurl4-openssl-dev libudev-dev libusb-1.0-0-dev libhidapi-dev \
            ocl-icd-opencl-dev opencl-headers libfuse2 imagemagick xvfb \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev-tools \
            qt6-declarative-dev libqt6websockets6-dev libqt6svg6-dev \
            libgl1-mesa-dev libxkbcommon-x11-dev libxcb-cursor0 \
            desktop-file-utils xdg-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build pinned SV2 miners
        working-directory: dinero-sv2
        run: cargo build --release --locked

      - name: Cache vendored prerequisites
        uses: actions/cache@v4
        with:
          path: |
            source/third_party/openssl-3.5.7
            source/third_party/bulletproofs_ffi/target
            ~/.cargo/registry
            ~/.cargo/git
          key: desktop-linux-${{ steps.provenance.outputs.source_head }}-${{ env.SV2_REF }}

      - name: Build vendored OpenSSL 3.5.7
        run: bash scripts/build-openssl-vendored.sh

      - name: Configure exact release
        env:
          DINERO_SV2_SOURCE_ROOT: ${{ github.workspace }}/dinero-sv2
        run: |
          cmake -S . -B build-desktop -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDINERO_USE_VENDORED_DEPS=ON \
            -DDINERO_BUILD_QT=ON \
            -DDINERO_BUILD_MINER=ON \
            -DDINERO_BUILD_SEEDER=ON \
            -DENABLE_GPU_MINING=ON \
            -DENABLE_GRPC=OFF \
            -DDINERO_ENABLE_PORTMAPPING=OFF \
            -DDINERO_ENABLE_QUIC=ON \
            -DDINERO_RELEASE_TAG=${{ steps.provenance.outputs.version }} \
            -DDINERO_SV2_SOURCE_ROOT="$DINERO_SV2_SOURCE_ROOT"

      - name: Build complete desktop stack
        run: |
          cmake --build build-desktop -j"$(nproc)" --target \
            dinerod dinero-cli dinero-qt dinero-miner dinero-stratum-worker \
            dinero-wallet-cli dinero-gpu-miner dinero-solo-miner-cli dinero-seeder

      - name: Assert OpenSSL policy pin
        run: bash scripts/ci/check_openssl_version.sh build-desktop 3.5.7

      - name: Fetch and verify snapshot pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-inputs
          gh release download "${{ inputs.release_tag }}" \
            --repo DineroLabs/dinero-v8 \
            --pattern dinero-assumeutxo-84131-v4.dat \
            --pattern dinero-assumeutxo-84131-v4.manifest.json \
            --dir release-inputs
          gh release download v8.0.17 \
            --repo DineroLabs/dinero-v8 \
            --pattern utxo-snapshot-65300.dat \
            --pattern utxo-snapshot-65300.dat.manifest.json \
            --dir release-inputs
          echo "DINERO_SNAPSHOT_DAT=$PWD/release-inputs/dinero-assumeutxo-84131-v4.dat" >> "$GITHUB_ENV"
          echo "DINERO_SNAPSHOT_MANIFEST=$PWD/release-inputs/dinero-assumeutxo-84131-v4.manifest.json" >> "$GITHUB_ENV"
          echo "DINERO_SNAPSHOT_FALLBACK_DAT=$PWD/release-inputs/utxo-snapshot-65300.dat" >> "$GITHUB_ENV"
          echo "DINERO_SNAPSHOT_FALLBACK_MANIFEST=$PWD/release-inputs/utxo-snapshot-65300.dat.manifest.json" >> "$GITHUB_ENV"

      - name: Install pinned linuxdeploy tools
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL \
            -o "$HOME/bin/linuxdeploy-x86_64.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_TAG}/linuxdeploy-x86_64.AppImage"
          curl -fsSL \
            -o "$HOME/bin/linuxdeploy-plugin-qt-x86_64.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/${LINUXDEPLOY_QT_TAG}/linuxdeploy-plugin-qt-x86_64.AppImage"
          printf '%s  %s\n' "$LINUXDEPLOY_SHA256" "$HOME/bin/linuxdeploy-x86_64.AppImage" | sha256sum -c -
          printf '%s  %s\n' "$LINUXDEPLOY_QT_SHA256" "$HOME/bin/linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum -c -
          chmod +x "$HOME/bin/linuxdeploy-x86_64.AppImage" "$HOME/bin/linuxdeploy-plugin-qt-x86_64.AppImage"

      - name: Build AppImage, portable Qt tarball, and desktop deb
        env:
          DINERO_SV2_SOURCE_ROOT: ${{ github.workspace }}/dinero-sv2
        run: |
          mkdir -p dist
          bash packaging/linux/build-appimage.sh \
            "${{ steps.provenance.outputs.version }}" "$PWD/build-desktop" "$PWD/dist"
          bash packaging/linux/build-qt-tarball.sh \
            "${{ steps.provenance.outputs.version }}" "$PWD/dist"
          bash packaging/linux/build-qt-deb.sh \
            "${{ steps.provenance.outputs.version }}" "$PWD/build-desktop" "$PWD/dist"

      - name: Verify Linux desktop artifacts and real Qt daemon launch
        run: |
          set -euo pipefail
          V="${{ steps.provenance.outputs.version }}"
          APPIMAGE="dist/dinero-v${V}-linux-x86_64.AppImage"
          TARBALL="dist/dinero-v${V}-linux-x86_64-qt.tar.gz"
          DEB="dist/dinero-qt-desktop_${V}-1_amd64.deb"
          test -x "$APPIMAGE" && test -s "$TARBALL" && test -s "$DEB"

          EXTRACT="$RUNNER_TEMP/appimage-extract"
          mkdir -p "$EXTRACT"
          (cd "$EXTRACT" && "$GITHUB_WORKSPACE/source/$APPIMAGE" --appimage-extract >/dev/null)
          for bin in dinerod dinero-cli dinero-qt dinero-seeder dinero-miner \
                     dinero-solo-miner dinero-gpu-miner dinero-stratum-worker \
                     dinero-wallet-cli dinero-sv2-miner dinero-sv2-gpu-miner; do
            test -x "$EXTRACT/squashfs-root/usr/bin/$bin" || {
              echo "::error::missing AppImage binary: $bin"; exit 1;
            }
            if ldd "$EXTRACT/squashfs-root/usr/bin/$bin" 2>&1 | grep -q 'not found'; then
              echo "::error::$bin has unresolved dynamic dependencies"; exit 1
            fi
          done
          if objdump -p "$EXTRACT/squashfs-root/usr/bin/dinerod" | grep -q 'NEEDED.*libOpenCL'; then
            find "$EXTRACT/squashfs-root" -type f -name 'libOpenCL.so*' | grep -q . || {
              echo "::error::AppImage dinerod needs libOpenCL but the loader was not bundled"; exit 1;
            }
          fi

          TEST_HOME=$(mktemp -d)
          export HOME="$TEST_HOME"
          export XDG_CONFIG_HOME="$TEST_HOME/config"
          export XDG_DATA_HOME="$TEST_HOME/data"
          xvfb-run -a "$EXTRACT/squashfs-root/AppRun" >"$TEST_HOME/qt.log" 2>&1 &
          LAUNCHER_PID=$!
          DAEMON_PIDS=""
          for _ in $(seq 1 90); do
            DAEMON_PIDS=$(pgrep -f "$EXTRACT/squashfs-root/usr/bin/dinerod( |$)" || true)
            [ -n "$DAEMON_PIDS" ] && break
            kill -0 "$LAUNCHER_PID" 2>/dev/null || { cat "$TEST_HOME/qt.log"; exit 1; }
            sleep 1
          done
          [ -n "$DAEMON_PIDS" ] || { cat "$TEST_HOME/qt.log"; echo "::error::Qt did not start bundled dinerod"; exit 1; }
          sleep 5
          COUNT=$(pgrep -f "$EXTRACT/squashfs-root/usr/bin/dinerod( |$)" | wc -l)
          [ "$COUNT" -eq 1 ] || { cat "$TEST_HOME/qt.log"; echo "::error::expected one daemon child, got $COUNT"; exit 1; }
          kill "$LAUNCHER_PID" 2>/dev/null || true
          printf '%s\n' "$DAEMON_PIDS" | xargs kill 2>/dev/null || true
          wait "$LAUNCHER_PID" 2>/dev/null || true

          TAR_TMP=$(mktemp -d)
          tar -xzf "$TARBALL" -C "$TAR_TMP"
          (cd "$TAR_TMP/dinero-v${V}-linux-x86_64-qt" && sha256sum -c SHA256SUMS.txt)
          DEB_TMP=$(mktemp -d)
          dpkg-deb -x "$DEB" "$DEB_TMP"
          for bin in dinerod dinero-cli dinero-qt dinero-seeder dinero-miner \
                     dinero-solo-miner dinero-gpu-miner dinero-stratum-worker \
                     dinero-wallet-cli dinero-sv2-miner dinero-sv2-gpu-miner; do
            test -x "$DEB_TMP/opt/dinero-qt-desktop/bin/$bin" || {
              echo "::error::missing deb binary: $bin"; exit 1;
            }
          done
          dpkg-deb --info "$DEB" >/dev/null

      - name: Write desktop checksums
        id: package
        run: |
          V="${{ steps.provenance.outputs.version }}"
          SUMS="dist/SHA256SUMS-linux-x86_64-desktop-${V}"
          (cd dist && sha256sum \
            "dinero-v${V}-linux-x86_64.AppImage" \
            "dinero-v${V}-linux-x86_64-qt.tar.gz" \
            "dinero-qt-desktop_${V}-1_amd64.deb" \
            > "$(basename "$SUMS")")
          cat "$SUMS"
          echo "checksums=$SUMS" >> "$GITHUB_OUTPUT"

      - name: Upload verified Linux desktop assets
        uses: actions/upload-artifact@v4
        with:
          name: dinero-linux-desktop-${{ steps.provenance.outputs.version }}
          path: |
            source/dist/dinero-v${{ steps.provenance.outputs.version }}-linux-x86_64.AppImage
            source/dist/dinero-v${{ steps.provenance.outputs.version }}-linux-x86_64-qt.tar.gz
            source/dist/dinero-qt-desktop_${{ steps.provenance.outputs.version }}-1_amd64.deb
            source/dist/SHA256SUMS-linux-x86_64-desktop-${{ steps.provenance.outputs.version }}
            source/desktop-release-provenance-linux.txt
          if-no-files-found: error
          retention-days: 14

  macos-intel-desktop:
    name: macOS Intel — unsigned Qt release stage
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26-intel
    timeout-minutes: 180

    defaults:
      run:
        working-directory: source

    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          path: source
          submodules: recursive
          fetch-depth: 1

      - name: Checkout reviewed release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 1

      - name: Checkout pinned SV2 miners
        uses: actions/checkout@v4
        with:
          repository: DineroLabs/dinero-sv2
          ref: ${{ env.SV2_REF }}
          path: dinero-sv2
          fetch-depth: 1

      - name: Record and verify provenance
        id: provenance
        run: |
          set -euo pipefail
          test "$(git describe --tags --exact-match HEAD)" = "${{ inputs.release_tag }}"
          SOURCE_HEAD=$(git rev-parse HEAD)
          TOOLING_HEAD=$(git -C "${GITHUB_WORKSPACE}/tooling" rev-parse HEAD)
          SV2_HEAD=$(git -C "${GITHUB_WORKSPACE}/dinero-sv2" rev-parse HEAD)
          test "$TOOLING_HEAD" = "$GITHUB_SHA"
          test "$SV2_HEAD" = "$SV2_REF"
          V="${{ inputs.release_tag }}"; V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "source_head=$SOURCE_HEAD" >> "$GITHUB_OUTPUT"
          echo "tooling_head=$TOOLING_HEAD" >> "$GITHUB_OUTPUT"
          {
            echo "release_tag=${{ inputs.release_tag }}"
            echo "source_commit=$SOURCE_HEAD"
            echo "tooling_commit=$TOOLING_HEAD"
            echo "sv2_commit=$SV2_HEAD"
            echo "runner=${RUNNER_OS} ${RUNNER_ARCH}"
          } | tee desktop-release-provenance-macos-x86_64.txt

      - name: Overlay reviewed architecture-aware packaging helpers
        run: |
          cp "${GITHUB_WORKSPACE}/tooling/packaging/mac/build-installer.sh" packaging/mac/
          cp "${GITHUB_WORKSPACE}/tooling/packaging/mac/assert-v8-release-lane.sh" packaging/mac/
          chmod +x packaging/mac/build-installer.sh packaging/mac/assert-v8-release-lane.sh

      - name: Install Rust and build tools
        run: |
          brew install ninja ccache qt
          echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"
          echo "QT_PREFIX=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build pinned SV2 miners
        working-directory: dinero-sv2
        run: cargo build --release --locked

      - name: Cache vendored prerequisites
        uses: actions/cache@v4
        with:
          path: |
            source/third_party/openssl-3.5.7/prebuilt
            source/depends/sources
            source/third_party/bulletproofs_ffi/target
            ~/.cargo/registry
            ~/.cargo/git
          key: desktop-macos-intel-${{ steps.provenance.outputs.source_head }}-${{ env.SV2_REF }}

      - name: Build vendored prerequisites
        run: |
          OPENSSL_REBUILD=1 bash scripts/build-openssl-vendored.sh
          cmake -S depends -B depends/build
          cmake --build depends/build -j"$(sysctl -n hw.ncpu)"

      - name: Fetch and verify snapshot pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-inputs
          gh release download "${{ inputs.release_tag }}" \
            --repo DineroLabs/dinero-v8 \
            --pattern dinero-assumeutxo-84131-v4.dat \
            --pattern dinero-assumeutxo-84131-v4.manifest.json \
            --dir release-inputs
          gh release download v8.0.17 \
            --repo DineroLabs/dinero-v8 \
            --pattern utxo-snapshot-65300.dat \
            --pattern utxo-snapshot-65300.dat.manifest.json \
            --dir release-inputs
          echo "DINERO_SNAPSHOT_DAT=$PWD/release-inputs/dinero-assumeutxo-84131-v4.dat" >> "$GITHUB_ENV"
          echo "DINERO_SNAPSHOT_MANIFEST=$PWD/release-inputs/dinero-assumeutxo-84131-v4.manifest.json" >> "$GITHUB_ENV"
          echo "DINERO_SNAPSHOT_FALLBACK_DAT=$PWD/release-inputs/utxo-snapshot-65300.dat" >> "$GITHUB_ENV"
          echo "DINERO_SNAPSHOT_FALLBACK_MANIFEST=$PWD/release-inputs/utxo-snapshot-65300.dat.manifest.json" >> "$GITHUB_ENV"

      - name: Configure exact Intel release
        env:
          DINERO_SV2_SOURCE_ROOT: ${{ github.workspace }}/dinero-sv2
        run: |
          cmake -S . -B build-desktop -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DDINERO_USE_VENDORED_DEPS=ON \
            -DDINERO_BUILD_QT=ON \
            -DDINERO_BUILD_MINER=ON \
            -DDINERO_BUILD_SEEDER=ON \
            -DENABLE_GPU_MINING=ON \
            -DMINER_ENABLE_OPENCL=ON \
            -DENABLE_GRPC=OFF \
            -DDINERO_ENABLE_PORTMAPPING=ON \
            -DDINERO_ENABLE_QUIC=ON \
            -DDINERO_RELEASE_TAG=${{ steps.provenance.outputs.version }} \
            -DDINERO_SV2_SOURCE_ROOT="$DINERO_SV2_SOURCE_ROOT" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build complete Intel desktop stack
        run: |
          cmake --build build-desktop -j"$(sysctl -n hw.ncpu)" --target \
            dinerod dinero-cli dinero-qt dinero-miner dinero-stratum-worker \
            dinero-wallet-cli dinero-gpu-miner dinero-solo-miner-cli dinero-seeder

      - name: Build unsigned Intel release stage
        env:
          DINERO_RELEASE_ARCH: x86_64
        run: |
          bash packaging/mac/build-installer.sh \
            --version "${{ steps.provenance.outputs.version }}" \
            --arch x86_64 \
            --build-dir build-desktop

      - name: Verify Intel architecture and real Qt daemon launch
        run: |
          set -euo pipefail
          APP="packaging/mac/dist/stage/dinero-qt.app"
          test -d "$APP"
          MACHO_COUNT=0
          while IFS= read -r -d '' path; do
            if file "$path" | grep -q 'Mach-O'; then
              ARCHES=$(lipo -archs "$path")
              [ "$ARCHES" = "x86_64" ] || {
                echo "::error::non-Intel Mach-O in bundle: $path ($ARCHES)"; exit 1;
              }
              MACHO_COUNT=$((MACHO_COUNT + 1))
            fi
          done < <(find "$APP" -type f -print0)
          [ "$MACHO_COUNT" -gt 10 ] || { echo "::error::too few Mach-O files checked: $MACHO_COUNT"; exit 1; }

          TEST_HOME=$(mktemp -d)
          # macdeployqt ships the native cocoa platform plugin on macOS; it does
          # not ship Qt's offscreen plugin. Hosted macOS runners have a WindowServer,
          # so exercise the same platform plugin end users will actually load.
          HOME="$TEST_HOME" QT_QPA_PLATFORM=cocoa \
            "$APP/Contents/MacOS/dinero-qt" >"$TEST_HOME/qt.log" 2>&1 &
          QT_PID=$!
          DAEMON_PID=""
          for _ in $(seq 1 90); do
            DAEMON_PID=$(pgrep -P "$QT_PID" -f '/dinerod( |$)' || true)
            [ -n "$DAEMON_PID" ] && break
            kill -0 "$QT_PID" 2>/dev/null || { cat "$TEST_HOME/qt.log"; exit 1; }
            sleep 1
          done
          [ -n "$DAEMON_PID" ] || { cat "$TEST_HOME/qt.log"; echo "::error::Intel Qt did not start bundled dinerod"; exit 1; }
          sleep 5
          COUNT=$(pgrep -P "$QT_PID" -f '/dinerod( |$)' | wc -l)
          [ "$COUNT" -eq 1 ] || { cat "$TEST_HOME/qt.log"; echo "::error::expected one daemon child, got $COUNT"; exit 1; }
          kill "$QT_PID" 2>/dev/null || true
          wait "$QT_PID" 2>/dev/null || true
          echo "verified_macho_files=$MACHO_COUNT" | tee -a desktop-release-provenance-macos-x86_64.txt

      - name: Archive unsigned Intel stage for local signing
        id: archive
        run: |
          V="${{ steps.provenance.outputs.version }}"
          cp desktop-release-provenance-macos-x86_64.txt packaging/mac/dist/
          ARCHIVE="dinero-macos-x86_64-desktop-stage-${V}.zip"
          (cd packaging/mac && ditto -c -k --sequesterRsrc --keepParent dist "$GITHUB_WORKSPACE/$ARCHIVE")
          shasum -a 256 "$GITHUB_WORKSPACE/$ARCHIVE"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned Intel release stage
        uses: actions/upload-artifact@v4
        with:
          name: dinero-macos-x86_64-desktop-stage-${{ steps.provenance.outputs.version }}
          path: ${{ steps.archive.outputs.archive }}
          if-no-files-found: error
          retention-days: 14
