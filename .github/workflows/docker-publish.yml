name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact Dinero version to build (8.2.3 for this candidate)"
        required: true
      candidate_source:
        description: "Full source SHA for pre-publication exact-binary dry run"
        required: false
      publish_latest:
        description: "Also update latest (allowed only for GitHub's current latest stable release)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Build and smoke only; do not push (required for pre-release mirror inputs)"
        required: false
        type: boolean
        default: true
      snapshot_payload_url:
        description: "Optional qualified HTTPS publisher payload URL for dry-run bootstrap"
        required: false
      snapshot_manifest_url:
        description: "Optional signed publisher manifest URL for dry-run bootstrap"
        required: false
      snapshot_signature_url:
        description: "Optional publisher signature URL for dry-run bootstrap"
        required: false
      binary_tarball_url:
        description: "Staged exact-source Linux archive HTTPS URL for dry run"
        required: false
      binary_sums_url:
        description: "Staged exact-source Linux SHA256SUMS HTTPS URL for dry run"
        required: false
      binary_tarball_sha256:
        description: "Reviewed SHA-256 of staged Linux archive"
        required: false
      binary_sums_sha256:
        description: "Reviewed SHA-256 of staged SHA256SUMS"
        required: false
  # PRs run source contracts only and say so explicitly. They cannot fetch
  # unpublished v8.2.3 assets, and an 8.2.2 binary transport smoke would not
  # qualify the final source. Manual dry-run and release events build the image.
  #
  # Path-filtered because the image is assembled from PUBLISHED release artifacts, not
  # from this tree's source (see Dockerfile stage 1) — a source-only PR cannot change
  # the image. These are the files that can.
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.dockerignore
      - .dockerignore
      - docker-entrypoint.sh
      - packaging/docker/**
      - packaging/snapshot/desktop-inputs-candidate.json
      - packaging/snapshot/check_desktop_primary.py
      - packaging/snapshot/fetch_desktop_primary.py
      - packaging/snapshot/snapshot_transport.py
      - packaging/snapshot/fleet-publisher-ed25519.pub.pem
      - scripts/ci/check_snapshot_freshness.py
      - .github/workflows/docker-publish.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # The repo also publishes dinerodpi-v* releases, which carry no
    # dinero-linux-x86_64-* asset. Without this guard `${GITHUB_REF_NAME#v}` leaves
    # such a tag intact, the build curls a 404 and the workflow goes red on every DPI
    # release. `on: release` cannot be tag-filtered, so the filter lives here — same
    # intent as linux-release.yml's `tags: ['v8.*']`.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'v8.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve Docker fresh and existing configuration authority
        run: python3 -B tests/integration/test_docker_entrypoint_config.py -v

      - name: Check full-v6 primary and four recovery fallback contracts
        run: python3 -B packaging/docker/test_full_v6_candidate.py -v

      - name: PR result is contract-only, not image-qualified
        if: github.event_name == 'pull_request'
        run: |
          echo 'Docker source contracts passed. Exact v8.2.3 image build, signed snapshot fetch, and fresh-volume/restart smoke remain required before publication.' >> "$GITHUB_STEP_SUMMARY"

      - name: Admit exact full-v6 catalog primary
        if: github.event_name != 'pull_request'
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          pin = json.loads(Path('packaging/snapshot/desktop-inputs-candidate.json').read_text())['primary']
          if (pin.get('filename') != 'dinero-assumeutxo-153051-v6-full.dat' or
                  pin.get('height') != 153051 or pin.get('format_version') != 6 or
                  pin.get('snapshot_profile') != 'full' or
                  type(pin.get('bytes')) is not int or pin['bytes'] < 109 or
                  not re.fullmatch(r'[0-9a-f]{64}', str(pin.get('sha256', ''))) or
                  not re.fullmatch(r'[0-9a-f]{64}', str(pin.get('block_hash', '')))):
              raise SystemExit('H153051 full-v6 image admission refused: native-qualified catalog pin is unavailable')
          print('Full-v6 catalog pin is present; Docker fetch verifies its exact signed payload.')
          PY

      - name: Resolve version
        if: github.event_name != 'pull_request'
        id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_CANDIDATE_SOURCE: ${{ github.event.inputs.candidate_source }}
          INPUT_PUBLISH_LATEST: ${{ github.event.inputs.publish_latest }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_SNAPSHOT_PAYLOAD_URL: ${{ github.event.inputs.snapshot_payload_url }}
          INPUT_SNAPSHOT_MANIFEST_URL: ${{ github.event.inputs.snapshot_manifest_url }}
          INPUT_SNAPSHOT_SIGNATURE_URL: ${{ github.event.inputs.snapshot_signature_url }}
          INPUT_BINARY_TARBALL_URL: ${{ github.event.inputs.binary_tarball_url }}
          INPUT_BINARY_SUMS_URL: ${{ github.event.inputs.binary_sums_url }}
          INPUT_BINARY_TARBALL_SHA256: ${{ github.event.inputs.binary_tarball_sha256 }}
          INPUT_BINARY_SUMS_SHA256: ${{ github.event.inputs.binary_sums_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            V="$INPUT_VERSION"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          [[ "$V" =~ ^8\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid image version '$V'"; exit 1; }
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_VERSION="$(sed -nE 's/^project\(dinero VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES.*$/\1/p' CMakeLists.txt)"
          test "$V" = "$SOURCE_VERSION" || { echo "::error::image version $V differs from source version $SOURCE_VERSION"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          override="${INPUT_SNAPSHOT_PAYLOAD_URL}${INPUT_SNAPSHOT_MANIFEST_URL}${INPUT_SNAPSHOT_SIGNATURE_URL}${INPUT_BINARY_TARBALL_URL}${INPUT_BINARY_SUMS_URL}${INPUT_BINARY_TARBALL_SHA256}${INPUT_BINARY_SUMS_SHA256}${INPUT_CANDIDATE_SOURCE}"
          if [ -n "$override" ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch && test "$INPUT_DRY_RUN" = true || {
              echo '::error::candidate inputs are allowed only in manual dry runs'; exit 1;
            }
            test "$V" = 8.2.3 || { echo '::error::candidate input version must be 8.2.3'; exit 1; }
            [[ "$INPUT_CANDIDATE_SOURCE" =~ ^[0-9a-f]{40}$ ]] && test "$SOURCE_SHA" = "$INPUT_CANDIDATE_SOURCE" || {
              echo '::error::candidate source SHA does not match the checked-out source'; exit 1;
            }
            for url in "$INPUT_SNAPSHOT_PAYLOAD_URL" "$INPUT_SNAPSHOT_MANIFEST_URL" "$INPUT_SNAPSHOT_SIGNATURE_URL" "$INPUT_BINARY_TARBALL_URL" "$INPUT_BINARY_SUMS_URL"; do
              [[ "$url" =~ ^https://[^[:space:]]+$ ]] || { echo '::error::all five immutable candidate URLs must use HTTPS'; exit 1; }
            done
            for digest in "$INPUT_BINARY_TARBALL_SHA256" "$INPUT_BINARY_SUMS_SHA256"; do
              [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::both candidate binary SHA-256 pins are required'; exit 1; }
            done
          fi
          echo "snapshot_payload_url=$INPUT_SNAPSHOT_PAYLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "snapshot_manifest_url=$INPUT_SNAPSHOT_MANIFEST_URL" >> "$GITHUB_OUTPUT"
          echo "snapshot_signature_url=$INPUT_SNAPSHOT_SIGNATURE_URL" >> "$GITHUB_OUTPUT"
          echo "binary_tarball_url=$INPUT_BINARY_TARBALL_URL" >> "$GITHUB_OUTPUT"
          echo "binary_sums_url=$INPUT_BINARY_SUMS_URL" >> "$GITHUB_OUTPUT"
          echo "binary_tarball_sha256=$INPUT_BINARY_TARBALL_SHA256" >> "$GITHUB_OUTPUT"
          echo "binary_sums_sha256=$INPUT_BINARY_SUMS_SHA256" >> "$GITHUB_OUTPUT"

          # `latest` must only ever move forward. Release events update it normally.
          # A manual repair may update it only when the requested version is still
          # GitHub's current latest stable v8 release.
          if [ "$GITHUB_EVENT_NAME" = "release" ] \
             && [ "$RELEASE_PRERELEASE" != "true" ] \
             && [ "$RELEASE_DRAFT" != "true" ]; then
            LATEST=true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
             && [ "$INPUT_DRY_RUN" != "true" ] \
             && [ "$INPUT_PUBLISH_LATEST" = "true" ]; then
            PUBLISHED_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | startswith("v8.")))][0].tag_name')"
            test "$PUBLISHED_TAG" = "v$V" || {
              echo "::error::refusing to move latest to v$V; current latest stable release is $PUBLISHED_TAG"
              exit 1
            }
            LATEST=true
          else
            LATEST=false
          fi
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "dry_run=$INPUT_DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Building Dinero $V (tag latest: $LATEST)"

      - uses: docker/setup-buildx-action@v3
        if: github.event_name != 'pull_request'

      # Every registry-touching step from here down is gated off on pull_request, so a
      # PR run never authenticates to any registry and never reads a secret.
      - name: Log in to GHCR
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && steps.v.outputs.dry_run == 'false')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build first WITHOUT pushing, load into the runner's daemon, and run the
      # binary. A build check alone is not enough: this image's own first bug was a
      # runtime one (the daemon built fine and then could not start for want of a
      # shared library). The runner is native amd64, so this costs seconds.
      - name: Build and load
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            DINERO_VERSION=${{ steps.v.outputs.version }}
            PRIMARY_SNAPSHOT_PAYLOAD_URL=${{ steps.v.outputs.snapshot_payload_url }}
            PRIMARY_SNAPSHOT_MANIFEST_URL=${{ steps.v.outputs.snapshot_manifest_url }}
            PRIMARY_SNAPSHOT_SIGNATURE_URL=${{ steps.v.outputs.snapshot_signature_url }}
            BINARY_TARBALL_URL=${{ steps.v.outputs.binary_tarball_url }}
            BINARY_SUMS_URL=${{ steps.v.outputs.binary_sums_url }}
            BINARY_TARBALL_SHA256=${{ steps.v.outputs.binary_tarball_sha256 }}
            BINARY_SUMS_SHA256=${{ steps.v.outputs.binary_sums_sha256 }}
            EXPECTED_SOURCE_SHA=${{ steps.v.outputs.source_sha }}
          tags: dinerod:ci

      - name: Run check — the image must actually start
        if: github.event_name != 'pull_request'
        run: |
          set -x
          docker run --rm --entrypoint /usr/local/bin/dinerod dinerod:ci --version

          # dinero-cli has no --version and exits 1 on an unknown option, so assert
          # on its output instead: what this check is really proving is that the
          # binary's dynamic dependencies resolve and it reaches main().
          cli_out="$(docker run --rm --entrypoint /usr/local/bin/dinero-cli dinerod:ci --version 2>&1 || true)"
          case "$cli_out" in
            *"Dinero RPC client"*) echo "dinero-cli runs" ;;
            *) echo "::error::dinero-cli did not run: $cli_out"; exit 1 ;;
          esac

          # the bundled snapshot must be installed under the name its manifest
          # declares, with the manifest as its sibling, or the daemon's trust gate
          # silently downgrades to a warning
          docker run --rm --entrypoint /bin/sh dinerod:ci -c "$(cat packaging/docker/check_image_layout.sh)"

      # Regression guard for the bug that bricked volumes: the daemon creates
      # /data/blocks and /data/blockchain seconds into startup, MINUTES before the
      # AssumeUTXO import at its configured header height. An entrypoint that arms the snapshot
      # "only on a fresh datadir" therefore stops arming it during that window, and a
      # restart inside the window leaves persisted AssumeUTXO metadata with no
      # configured snapshot path — dinerod then exits 2 on every subsequent start.
      #
      # This asserts on the argv `dinerod` ACTUALLY receives (a stub earlier on PATH
      # captures it), not on a log line, so it cannot be satisfied by logging alone. No
      # sync, no daemon, no network: milliseconds.
      - name: Restart-regression check — snapshot stays armed when /data/blocks exists
        if: github.event_name != 'pull_request'
        run: |
          set -x
          docker run --rm --entrypoint /bin/sh dinerod:ci -c '
            set -eu
            # the exact on-disk state of an interrupted first sync
            mkdir -p /data/blocks /data/blockchain
            mkdir -p /tmp/stub
            printf "#!/bin/sh\nprintf \"%%s\\n\" \"\$@\" > /tmp/argv\n" > /tmp/stub/dinerod
            chmod +x /tmp/stub/dinerod
            PATH=/tmp/stub:$PATH /usr/local/bin/docker-entrypoint.sh > /tmp/startup.log
            echo "--- argv dinerod received ---"; cat /tmp/argv
            echo "--- entrypoint startup line ---"; cat /tmp/startup.log

            grep -q -- "^--assumeutxo_snapshot=" /tmp/argv || {
              echo "::error::snapshot NOT armed with an existing /data/blocks — the interrupted-first-sync brick is back"; exit 1; }
            grep -Fx -- "--assumeutxo_snapshot_fallbacks=$DINERO_SNAPSHOT_FALLBACKS" /tmp/argv || {
              echo "::error::older exact-base snapshot fallback NOT armed — image upgrade can brick an in-progress lifecycle"; exit 1; }
            # the snapshot without forward-connect holds the tip at the base for the
            # whole genesis->base replay (PR #393): 0 confirmations for hours
            grep -qx -- "--assumeutxo_forward_connect=1" /tmp/argv || {
              echo "::error::--assumeutxo_forward_connect=1 missing"; exit 1; }
            # correction 5: RPC must not be reachable from other containers
            grep -qx -- "-rpcbind=127.0.0.1" /tmp/argv || {
              echo "::error::RPC is not bound to loopback by default"; exit 1; }
            # the startup line the operator sees must agree with the real argv
            grep -q "assumeutxo_snapshot=yes" /tmp/startup.log || {
              echo "::error::startup line does not report the armed snapshot"; exit 1; }
            grep -q "assumeutxo_fallbacks=yes" /tmp/startup.log || {
              echo "::error::startup line does not report the armed fallback"; exit 1; }
          '

          # ...and the startup line must NOT echo user-supplied arguments: they can
          # carry -rpcpassword=, and docker logs are world-readable to anyone with the
          # socket and are routinely shipped to log aggregators.
          leak_out="$(docker run --rm --entrypoint /bin/sh dinerod:ci -c '
            mkdir -p /tmp/stub
            printf "#!/bin/sh\nexit 0\n" > /tmp/stub/dinerod; chmod +x /tmp/stub/dinerod
            PATH=/tmp/stub:$PATH /usr/local/bin/docker-entrypoint.sh -rpcpassword=CANARY_SECRET 2>&1')"
          case "$leak_out" in
            *CANARY_SECRET*) echo "::error::the entrypoint printed a user-supplied argument: $leak_out"; exit 1 ;;
            *) echo "no argument leak in entrypoint output" ;;
          esac

      - name: Real daemon fresh-volume and restart smoke
        if: github.event_name != 'pull_request'
        run: bash packaging/docker/smoke_fresh_restart.sh dinerod:ci

      # Same context and build-args, so this reuses the layers built above.
      - name: Build and push
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && steps.v.outputs.dry_run == 'false')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            DINERO_VERSION=${{ steps.v.outputs.version }}
            PRIMARY_SNAPSHOT_PAYLOAD_URL=${{ steps.v.outputs.snapshot_payload_url }}
            PRIMARY_SNAPSHOT_MANIFEST_URL=${{ steps.v.outputs.snapshot_manifest_url }}
            PRIMARY_SNAPSHOT_SIGNATURE_URL=${{ steps.v.outputs.snapshot_signature_url }}
            BINARY_TARBALL_URL=${{ steps.v.outputs.binary_tarball_url }}
            BINARY_SUMS_URL=${{ steps.v.outputs.binary_sums_url }}
            BINARY_TARBALL_SHA256=${{ steps.v.outputs.binary_tarball_sha256 }}
            BINARY_SUMS_SHA256=${{ steps.v.outputs.binary_sums_sha256 }}
            EXPECTED_SOURCE_SHA=${{ steps.v.outputs.source_sha }}
          tags: |
            ghcr.io/dinerolabs/dinero-v8:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.latest == 'true' && 'ghcr.io/dinerolabs/dinero-v8:latest' || '' }}
