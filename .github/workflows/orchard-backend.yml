name: Orchard backend component
on:
  push:
    branches: [main, dinero-main, 'codex/**']
    paths:
      - 'rust/orchard_backend/**'
      - '.github/workflows/orchard-backend.yml'
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/pq_bench/**'
      - 'cmake/**'
      - 'depends/**'
      - '.gitmodules'
      - 'third_party/**'
      - 'scripts/build-openssl-vendored.sh'
  pull_request:
    paths:
      - 'rust/orchard_backend/**'
      - '.github/workflows/orchard-backend.yml'
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/pq_bench/**'
      - 'cmake/**'
      - 'depends/**'
      - '.gitmodules'
      - 'third_party/**'
      - 'scripts/build-openssl-vendored.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orchard-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    name: Orchard pinned dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read pinned compiler
        id: rust-pin
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('rust/orchard_backend/rust-toolchain.toml', 'rb') as f:
              print('version=' + tomllib.load(f)['toolchain']['channel'])
          PYCODE
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - name: Install exact audit tool with its locked dependencies
        run: |
          cargo +${{ steps.rust-pin.outputs.version }} install cargo-audit --version 0.22.2 --locked --jobs 2 --root build-orchard-audit-tools
          build-orchard-audit-tools/bin/cargo-audit --version > orchard-audit-tool.txt
      - name: Audit committed graph against fresh advisories
        run: |
          set +e
          build-orchard-audit-tools/bin/cargo-audit audit --file rust/orchard_backend/Cargo.lock --db build-orchard-advisory-db --deny unsound --deny yanked --format json > orchard-dependency-audit.json
          audit_status=$?
          set -e
          printf '%s\n' "$audit_status" > orchard-dependency-audit-exit.txt
          git -C build-orchard-advisory-db rev-parse HEAD > orchard-advisory-db-head.txt
          git rev-parse HEAD > orchard-audit-source.txt
          sha256sum rust/orchard_backend/Cargo.lock > orchard-audit-lock-sha256.txt
          exit "$audit_status"
      - name: Display informational maintenance warnings
        if: always()
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = Path('orchard-dependency-audit.json')
          print('## Orchard dependency audit')
          print('Gate: known vulnerabilities, unsoundness advisories, yanked crates, and scanner errors fail. Maintenance notices remain visible below; they are not a cryptographic review.')
          data = json.loads(report.read_text())
          for kind, entries in data.get('warnings', {}).items():
              for entry in entries:
                  package, advisory = entry['package'], entry.get('advisory') or {}
                  print(f"- {kind}: {package['name']} {package['version']} — {advisory.get('id', '')} {advisory.get('title', '')}")
          PYCODE
      - name: Retain audit evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orchard-dependency-audit-${{ github.sha }}
          path: |
            orchard-audit-tool.txt
            orchard-audit-source.txt
            orchard-audit-lock-sha256.txt
            orchard-advisory-db-head.txt
            orchard-dependency-audit.json
            orchard-dependency-audit-exit.txt
            rust/orchard_backend/Cargo.lock
          if-no-files-found: error
  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize pinned transparent-signature library
        run: git submodule update --init third_party/secp256k1-zkp
      - name: Read pinned compiler
        id: rust-pin
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('rust/orchard_backend/rust-toolchain.toml', 'rb') as f:
              print('version=' + tomllib.load(f)['toolchain']['channel'])
          PYCODE
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action, explicit compiler below
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          components: rustfmt, clippy
      - name: Install native crypto and wallet storage dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev
      - name: Record exact source and compiler
        run: |
          git rev-parse HEAD
          rustc --version
          cmake --version
      - name: Format and lint pinned dependency graph
        run: |
          cargo +${{ steps.rust-pin.outputs.version }} fmt --manifest-path rust/orchard_backend/Cargo.toml -- --check
          cargo +${{ steps.rust-pin.outputs.version }} clippy --locked --release --manifest-path rust/orchard_backend/Cargo.toml --target-dir build-orchard-backend/cargo --all-targets -- -D warnings
      - name: Check independent envelope vectors
        run: |
          python3 rust/orchard_backend/tests/make_envelope_vector.py --check
          python3 rust/orchard_backend/tests/make_transparent_vector.py --check
          python3 rust/orchard_backend/tests/check_combined_vectors.py
          python3 rust/orchard_backend/tests/make_state_root_vectors.py --check
      - name: Build C++ and Rust together
        run: |
          cmake -S rust/orchard_backend -B build-orchard-backend -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-orchard-backend --parallel 2
      - name: Require all executable test lanes
        run: |
          ctest --test-dir build-orchard-backend --show-only=json-v1 > orchard-test-inventory.json
          python3 - <<'PY'
          import json
          tests = {x['name'] for x in json.load(open('orchard-test-inventory.json'))['tests']}
          if tests != {'OrchardAuthorization', 'OrchardBackendCpp', 'OrchardBackendRust', 'OrchardTransactionReader', 'OrchardCoinSnapshot', 'OrchardTransparent', 'OrchardStateTransition', 'OrchardTransactionContext', 'OrchardWalletKeys', 'OrchardWalletShield', 'OrchardWalletSpend', 'OrchardWalletStorage'}:
              raise SystemExit(f'wrong Orchard test inventory: {tests}')
          PY
          ctest --test-dir build-orchard-backend --output-on-failure --no-tests=error
      - name: Retain component evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orchard-backend-${{ github.sha }}
          path: |
            orchard-test-inventory.json
            build-orchard-backend/Testing/Temporary/LastTest.log
            build-orchard-backend/Testing/Temporary/LastTestsFailed.log
            rust/orchard_backend/Cargo.lock
          if-no-files-found: error

  root-linux:
    name: Orchard through root build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Install root build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 perl ripgrep \
            libcurl4-openssl-dev libudev-dev libusb-1.0-0-dev libsqlite3-dev
      - name: Read pinned compiler
        id: rust-pin
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('rust/orchard_backend/rust-toolchain.toml', 'rb') as f:
              print('version=' + tomllib.load(f)['toolchain']['channel'])
          PYCODE
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - name: Build root prerequisites
        run: |
          OPENSSL_VERSION=3.5.7 bash scripts/build-openssl-vendored.sh
          cmake -S depends -B depends/build
          cmake --build depends/build --parallel 2
      - name: Configure root with Orchard enabled
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          git rev-parse HEAD > orchard-root-source.txt
          cmake -S . -B build-orchard-root -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DDINERO_REPRODUCIBLE_BUILD=ON -DDINERO_ROCKSDB_BUILD_JOBS=2 \
            -DDINERO_USE_VENDORED_DEPS=ON -DENABLE_GRPC=OFF \
            -DDINERO_BUILD_ORCHARD_BACKEND=ON -DDINERO_ORCHARD_BUILD_TESTS=ON \
            -DBUILD_TESTING=ON
      - name: Build daemon and root Orchard targets
        run: |
          cmake --build build-orchard-root --target dinerod test_daemon_service_release test_mempool_service_owner test_pool_tip_consumers test_bridge_cache_owner test_bridge_forest_read_lock test_chainstate_commit_batch_interval test_mempool_callback_owner test_mempool_replacement_policy test_mempool_package_bounds test_mempool_maintenance_owner test_mempool_admission_owner test_mempool_policy_owner test_mempool_block_owner test_mempool_refresh_owner test_mempool_prepared_refresh test_relay_refresh_owner test_tx_relay_g3 test_csn_proof_refresh test_header_sync_p2p_integration test_rocksdb_checksum test_wallet_historical_rpc test_rpc_handler_drain test_wallet_pq_rpc_owner test_wallet_mainnet_readiness test_mining_height2 test_wallet_height2_coinbase test_pruning test_header_status_bits test_template_maturity test_wallet_input_coins test_header_metadata_recovery v7_p2mr_key_read_test v7_p2mr_inventory_test test_assumeutxo_replay test_wallet_rescan_utxoset test_orchard_account_delivery test_orchard_index_delivery test_wallet_database_lease test_wallet_block_disconnect test_wallet_revert_atomic test_mempool_proof_staleness test_utxo_publication test_orchard_state_commitment test_orchard_state_root test_orchard_legacy_accounting test_orchard_runtime_reader test_orchard_service_startup test_shielded_state_startup test_legacy_retirement test_state_commitment_canonical test_state_commitment_encoding test_state_commitment_external_vectors test_state_commitment_transitions test_orchard_backend test_orchard_wallet test_orchard_wallet_shield test_orchard_wallet_spend test_orchard_wallet_storage test_orchard_wallet_scan test_orchard_operation_queue test_orchard_proof_jobs test_orchard_wallet_account test_orchard_chain_restore test_orchard_operation_archive test_orchard_transaction_reader test_orchard_coin_snapshot test_orchard_transparent test_orchard_authorization test_orchard_state_transition test_orchard_block_reader test_orchard_block_coins test_orchard_resources test_orchard_block_filter test_orchard_header test_orchard_forest_transition test_orchard_block_staging test_orchard_state_storage test_orchard_legacy_boundary test_block_storage_roundtrip test_archival_block_reader --parallel 2
          ./build-orchard-root/dinerod --version
      - name: Require and execute initial mining and coinbase indexing fixtures
        run: |
          ctest --test-dir build-orchard-root -R '^(MiningHeight2|WalletHeight2Coinbase)$' --show-only=json-v1 > orchard-height-one-inventory.json
          python3 - <<'PYTEST'
          import json
          tests = json.load(open('orchard-height-one-inventory.json'))['tests']
          if sorted(t['name'] for t in tests) != ['MiningHeight2', 'WalletHeight2Coinbase'] or any(p['name'] == 'DISABLED' and p['value'] for t in tests for p in t.get('properties', [])):
              raise SystemExit('Initial mining/coinbase fixtures missing or disabled')
          PYTEST
          ctest --test-dir build-orchard-root -R '^(MiningHeight2|WalletHeight2Coinbase)$' --verbose --no-tests=error --output-log orchard-height-one-execution.log
          python3 - <<'PYTEST'
          log = open('orchard-height-one-execution.log').read()
          if log.count('✅ ALL TESTS PASSED') != 2:
              raise SystemExit('Both initial mining/coinbase fixtures must complete')
          for marker in ['First PoW block (Fair Launch v3) works correctly.', 'Wallet correctly tracks and enforces maturity for all coinbase outputs.']:
              if log.count(marker) != 1:
                  raise SystemExit('Missing or duplicate initial mining/coinbase completion')
          PYTEST
      - name: Require and execute pruning and header-status storage regressions
        run: |
          ctest --test-dir build-orchard-root -R '^(PruningTestSuite|HeaderStatusBits)$' --show-only=json-v1 > orchard-storage-test-link-inventory.json
          python3 - <<'PYTEST'
          import json
          tests = json.load(open('orchard-storage-test-link-inventory.json'))['tests']
          if sorted(t['name'] for t in tests) != ['HeaderStatusBits', 'PruningTestSuite'] or any(p['name'] == 'DISABLED' and p['value'] for t in tests for p in t.get('properties', [])):
              raise SystemExit('Pruning/header-status tests missing or disabled')
          PYTEST
          ctest --test-dir build-orchard-root -R '^(PruningTestSuite|HeaderStatusBits)$' --verbose --no-tests=error --output-log orchard-storage-test-link-execution.log
          python3 - <<'PYTEST'
          import re
          log = open('orchard-storage-test-link-execution.log').read()
          if log.count('Header status bits: 12/12 properties hold') != 1 or log.count('ALL TESTS PASSED ✓') != 1:
              raise SystemExit('Storage fixtures did not complete exactly once')
          if sorted(re.findall(r'\[Test ([1-5])\] ✓ PASS:', log)) != ['1', '2', '3', '4', '5']:
              raise SystemExit('Pruning cases missing or duplicated')
          PYTEST
      - name: Require and execute archival header metadata recovery
        run: |
          ctest --test-dir build-orchard-root -R '^HeaderMetadataRecovery$' --show-only=json-v1 > orchard-header-recovery-inventory.json
          python3 - <<'PYTEST'
          import json
          tests = json.load(open('orchard-header-recovery-inventory.json'))['tests']
          if [t['name'] for t in tests] != ['HeaderMetadataRecovery'] or any(p['name'] == 'DISABLED' and p['value'] for t in tests for p in t.get('properties', [])):
              raise SystemExit('HeaderMetadataRecovery missing or disabled')
          PYTEST
          ctest --test-dir build-orchard-root -R '^HeaderMetadataRecovery$' --verbose --no-tests=error --output-log orchard-header-recovery-execution.log
          python3 - <<'PYTEST'
          log = open('orchard-header-recovery-execution.log').read()
          if log.count('[PASS] header metadata recovery reconstructs missing rows safely') != 1:
              raise SystemExit('Header metadata recovery fixture did not complete exactly once')
          PYTEST
      - name: Require and execute chainstate checkpoint interval
        run: |
          ctest --test-dir build-orchard-root -R '^ChainstateCommitBatchInterval$' --show-only=json-v1 > orchard-checkpoint-interval-inventory.json
          python3 - <<'PYTEST'
          import json
          tests=json.load(open('orchard-checkpoint-interval-inventory.json'))['tests']
          if [t['name'] for t in tests]!=['ChainstateCommitBatchInterval'] or any(p['name']=='DISABLED' and p['value'] for t in tests for p in t.get('properties',[])):
              raise SystemExit('Checkpoint interval test missing or disabled')
          PYTEST
          ctest --test-dir build-orchard-root -R '^ChainstateCommitBatchInterval$' --verbose --no-tests=error --output-log orchard-checkpoint-interval-execution.log
          python3 - <<'PYTEST'
          import re
          log=open('orchard-checkpoint-interval-execution.log').read()
          expected=['DefaultIntervalRequiresCheckpointEveryBlock','NonIntervalHeightSkipsCheckpointOnly','IntervalHeightStillRequiresCheckpoint','ZeroIntervalBehavesLikeEveryBlock','StatelessModeRequiresRecoveryDelta']
          if sorted(re.findall(r'\[       OK \] ChainstateCommitBatchInterval\.(\w+)',log))!=sorted(expected):
              raise SystemExit('Checkpoint interval cases did not complete exactly once')
          PYTEST
      - name: Build and execute real mempool runtime test consumers
        run: |
          mapfile -t targets < build-orchard-root/real-mempool-fixture-targets.txt
          test "${#targets[@]}" -eq 20
          cmake --build build-orchard-root --parallel 4 --target "${targets[@]}" -- -k 0
          ctest --test-dir build-orchard-root --show-only=json-v1 > orchard-real-mempool-all-inventory.json
          python3 - <<'PYTEST'
          import json,pathlib,re
          targets=set(pathlib.Path('build-orchard-root/real-mempool-fixture-targets.txt').read_text().splitlines())
          all_tests=json.load(open('orchard-real-mempool-all-inventory.json'))['tests']
          tests=[t for t in all_tests if t.get('command') and pathlib.Path(t['command'][0]).name in targets]
          if {pathlib.Path(t['command'][0]).name for t in tests}!=targets or any(p['name']=='DISABLED' and p['value'] for t in tests for p in t.get('properties',[])):
              raise SystemExit('Real mempool test consumers missing or disabled')
          json.dump({'tests':tests},open('orchard-real-mempool-inventory.json','w'),indent=2)
          pathlib.Path('orchard-real-mempool-regex.txt').write_text('^('+'|'.join(re.escape(t['name']) for t in tests)+')$')
          # Every compiled replay-binary case must have exactly one enabled CTest owner.
          import fnmatch,subprocess
          replay=[t for t in tests if pathlib.Path(t['command'][0]).name=='test_assumeutxo_replay']
          assert replay
          listing=subprocess.check_output([replay[0]['command'][0],'--gtest_list_tests'],text=True)
          pathlib.Path('orchard-replay-case-list.txt').write_text(listing)
          cases=[];suite=None
          for line in listing.splitlines():
              if line and not line[0].isspace() and line.endswith('.'):suite=line.strip()
              elif line.startswith('  ') and suite:cases.append(suite+line.strip().split(' #',1)[0])
          assert cases and len(cases)==len(set(cases))
          owners={case:[] for case in cases}
          for test in replay:
              filters=[v.split('=',1)[1] for v in test['command'][1:] if v.startswith('--gtest_filter=')]
              assert len(filters)==1 and '-' not in filters[0]
              matched=[case for case in cases if any(fnmatch.fnmatchcase(case,p) for p in filters[0].split(':'))]
              assert matched,(test['name'],'empty filter')
              for case in matched:owners[case].append(test['name'])
          assert all(len(v)==1 for v in owners.values()),owners
          json.dump(owners,open('orchard-replay-case-owners.json','w'),indent=2)
          PYTEST
          ctest --test-dir build-orchard-root -R "$(cat orchard-real-mempool-regex.txt)" --verbose --no-tests=error --output-log orchard-real-mempool-execution.log
          python3 - <<'PYTEST'
          import json,re
          names=[t['name'] for t in json.load(open('orchard-real-mempool-inventory.json'))['tests']]
          log=open('orchard-real-mempool-execution.log').read()
          if sorted(re.findall(r'Test\s+#\d+:\s+(\S+)\s+\.+\s+Passed',log))!=sorted(names):
              raise SystemExit('Real mempool test consumer executions incomplete')
          for case in json.load(open('orchard-replay-case-owners.json')):
              assert log.count('[       OK ] '+case+' (')==1,case
          PYTEST
      - name: Consistent mining selection and fee snapshot
        run: |
          cmake --build build-orchard-root --target test_mining_selection_snapshot --parallel 4 -- -k 0
          ctest --test-dir build-orchard-root -R '^MiningSelectionSnapshot$' --show-only=json-v1 > orchard-mining-selection-snapshot-inventory.json
          python3 - <<'PYSNAPSHOT'
          import json
          tests=json.load(open('orchard-mining-selection-snapshot-inventory.json'))['tests']
          assert [t['name'] for t in tests]==['MiningSelectionSnapshot']
          assert not any(p['name']=='DISABLED' and p['value'] for t in tests for p in t.get('properties',[]))
          PYSNAPSHOT
          ctest --test-dir build-orchard-root -R '^MiningSelectionSnapshot$' --verbose --no-tests=error --output-log orchard-mining-selection-snapshot-execution.log
          python3 - <<'PYSNAPSHOT'
          import re
          log=open('orchard-mining-selection-snapshot-execution.log').read()
          assert re.findall(r'Test\s+#\d+:\s+(\S+)\s+\.+\s+Passed',log)==['MiningSelectionSnapshot']
          cases=['CapturedMetadataSurvivesPoolClear','JobAndRpcTemplateKeepCapturedFees','UnavailableChainCaptureRefusesMining']
          assert sorted(re.findall(r'\[       OK \] MiningSelectionSnapshot\.(\w+)',log))==sorted(cases)
          PYSNAPSHOT
      - name: Ancestor-safe mining package selection
        run: |
          cmake --build build-orchard-root --target test_mining_package_selection --parallel 4 -- -k 0
          ctest --test-dir build-orchard-root -R '^MiningPackageSelection$' --show-only=json-v1 > orchard-mining-package-selection-inventory.json
          python3 - <<'PYSNAPSHOT'
          import json
          tests=json.load(open('orchard-mining-package-selection-inventory.json'))['tests']
          assert [t['name'] for t in tests]==['MiningPackageSelection']
          assert not any(p['name']=='DISABLED' and p['value'] for t in tests for p in t.get('properties',[]))
          PYSNAPSHOT
          ctest --test-dir build-orchard-root -R '^MiningPackageSelection$' --verbose --no-tests=error --output-log orchard-mining-package-selection-execution.log
          python3 - <<'PYSNAPSHOT'
          import re
          log=open('orchard-mining-package-selection-execution.log').read()
          assert re.findall(r'Test\s+#\d+:\s+(\S+)\s+\.+\s+Passed',log)==['MiningPackageSelection']
          cases=['RankedChildRetainsParentAndExactWeight','SharedParentIncludedExactlyOnce','RejectedParentCannotLeaveSelectedChild']
          assert sorted(re.findall(r'\[       OK \] MiningPackageSelection\.(\w+)',log))==sorted(cases)
          PYSNAPSHOT
      - name: Shared mining job selection policy
        run: |
          cmake --build build-orchard-root --target test_mining_job_policy --parallel 4 -- -k 0
          ctest --test-dir build-orchard-root -R '^MiningJobPolicy$' --show-only=json-v1 > orchard-mining-job-policy-inventory.json
          python3 - <<'PYSNAPSHOT'
          import json
          tests=json.load(open('orchard-mining-job-policy-inventory.json'))['tests']
          assert [t['name'] for t in tests]==['MiningJobPolicy']
          assert not any(p['name']=='DISABLED' and p['value'] for t in tests for p in t.get('properties',[]))
          PYSNAPSHOT
          ctest --test-dir build-orchard-root -R '^MiningJobPolicy$' --verbose --no-tests=error --output-log orchard-mining-job-policy-execution.log
          python3 - <<'PYSNAPSHOT'
          import re
          log=open('orchard-mining-job-policy-execution.log').read()
          assert re.findall(r'Test\s+#\d+:\s+(\S+)\s+\.+\s+Passed',log)==['MiningJobPolicy']
          cases=['JobAppliesParentPolicyAndRetry','JobIncludesSharedParentExactlyOnce','JobHonorsExactWeightBoundary']
          assert sorted(re.findall(r'\[       OK \] MiningJobPolicy\.(\w+)',log))==sorted(cases)
          PYSNAPSHOT
      - name: Owned mining template and RPC results
        run: |
          cmake --build build-orchard-root --target test_mining_template_result --parallel 4 -- -k 0
          ctest --test-dir build-orchard-root -R '^MiningTemplateResult$' --show-only=json-v1 > orchard-mining-template-result-inventory.json
          python3 - <<'PYSNAPSHOT'
          import json
          tests=json.load(open('orchard-mining-template-result-inventory.json'))['tests']
          assert [t['name'] for t in tests]==['MiningTemplateResult']
          assert not any(p['name']=='DISABLED' and p['value'] for t in tests for p in t.get('properties',[]))
          PYSNAPSHOT
          ctest --test-dir build-orchard-root -R '^MiningTemplateResult$' --verbose --no-tests=error --output-log orchard-mining-template-result-execution.log
          python3 - <<'PYSNAPSHOT'
          import re
          log=open('orchard-mining-template-result-execution.log').read()
          assert re.findall(r'Test\s+#\d+:\s+(\S+)\s+\.+\s+Passed',log)==['MiningTemplateResult']
          cases=['CapturedFeesSurvivePoolRemoval','ExcludedAncestorsHaveNoResultFees','FailurePreservesOutputAndEmptyRetryReplacesIt']
          assert sorted(re.findall(r'\[       OK \] MiningTemplateResult\.(\w+)',log))==sorted(cases)
          PYSNAPSHOT
      - name: Selected-chain ownership during mining construction
        run: |
