name: Orchard backend component
on:
  push:
    branches: [main, dinero-main, 'codex/**']
    paths:
      - 'rust/orchard_backend/**'
      - '.github/workflows/orchard-backend.yml'
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'cmake/**'
      - 'depends/**'
      - '.gitmodules'
      - 'third_party/**'
      - 'scripts/build-openssl-vendored.sh'
  pull_request:
    paths:
      - 'rust/orchard_backend/**'
      - '.github/workflows/orchard-backend.yml'
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'cmake/**'
      - 'depends/**'
      - '.gitmodules'
      - 'third_party/**'
      - 'scripts/build-openssl-vendored.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orchard-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize pinned transparent-signature library
        run: git submodule update --init third_party/secp256k1-zkp
      - name: Read pinned compiler
        id: rust-pin
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('rust/orchard_backend/rust-toolchain.toml', 'rb') as f:
              print('version=' + tomllib.load(f)['toolchain']['channel'])
          PYCODE
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action, explicit compiler below
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          components: rustfmt, clippy
      - name: Install native crypto dependency
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Record exact source and compiler
        run: |
          git rev-parse HEAD
          rustc --version
          cmake --version
      - name: Format and lint pinned dependency graph
        run: |
          cargo +${{ steps.rust-pin.outputs.version }} fmt --manifest-path rust/orchard_backend/Cargo.toml -- --check
          cargo +${{ steps.rust-pin.outputs.version }} clippy --locked --release --manifest-path rust/orchard_backend/Cargo.toml --target-dir build-orchard-backend/cargo --all-targets -- -D warnings
      - name: Check independent envelope vectors
        run: |
          python3 rust/orchard_backend/tests/make_envelope_vector.py --check
          python3 rust/orchard_backend/tests/make_transparent_vector.py --check
      - name: Build C++ and Rust together
        run: |
          cmake -S rust/orchard_backend -B build-orchard-backend -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-orchard-backend --parallel 2
      - name: Require all executable test lanes
        run: |
          ctest --test-dir build-orchard-backend --show-only=json-v1 > orchard-test-inventory.json
          python3 - <<'PY'
          import json
          tests = {x['name'] for x in json.load(open('orchard-test-inventory.json'))['tests']}
          if tests != {'OrchardBackendCpp', 'OrchardBackendRust', 'OrchardTransactionReader', 'OrchardCoinSnapshot', 'OrchardTransparent'}:
              raise SystemExit(f'wrong Orchard test inventory: {tests}')
          PY
          ctest --test-dir build-orchard-backend --output-on-failure --no-tests=error
      - name: Retain component evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orchard-backend-${{ github.sha }}
          path: |
            orchard-test-inventory.json
            build-orchard-backend/Testing/Temporary/LastTest.log
            build-orchard-backend/Testing/Temporary/LastTestsFailed.log
            rust/orchard_backend/Cargo.lock
          if-no-files-found: error

  root-linux:
    name: Orchard through root build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Install root build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 perl ripgrep \
            libcurl4-openssl-dev libudev-dev libusb-1.0-0-dev
      - name: Read pinned compiler
        id: rust-pin
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('rust/orchard_backend/rust-toolchain.toml', 'rb') as f:
              print('version=' + tomllib.load(f)['toolchain']['channel'])
          PYCODE
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - name: Build root prerequisites
        run: |
          OPENSSL_VERSION=3.5.7 bash scripts/build-openssl-vendored.sh
          cmake -S depends -B depends/build
          cmake --build depends/build --parallel 2
      - name: Configure root with Orchard enabled
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          git rev-parse HEAD > orchard-root-source.txt
          cmake -S . -B build-orchard-root -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DDINERO_REPRODUCIBLE_BUILD=ON \
            -DDINERO_USE_VENDORED_DEPS=ON -DENABLE_GRPC=OFF \
            -DDINERO_BUILD_ORCHARD_BACKEND=ON -DDINERO_ORCHARD_BUILD_TESTS=ON \
            -DBUILD_TESTING=ON
      - name: Build daemon and root Orchard targets
        run: |
          cmake --build build-orchard-root --target dinerod test_orchard_backend test_orchard_transaction_reader test_orchard_coin_snapshot test_orchard_transparent test_orchard_legacy_boundary --parallel 2
          ./build-orchard-root/dinerod --version
      - name: Require and execute all root Orchard lanes
        run: |
          ctest --test-dir build-orchard-root -R '^(OrchardBackend(Cpp|Rust)|OrchardTransactionReader|OrchardCoinSnapshot|OrchardTransparent|OrchardLegacyBoundary)$' --show-only=json-v1 > orchard-root-inventory.json
          python3 - <<'PYCODE'
          import json
          with open('orchard-root-inventory.json') as f:
              tests = json.load(f)['tests']
          names = [x['name'] for x in tests]
          if sorted(names) != ['OrchardBackendCpp', 'OrchardBackendRust', 'OrchardCoinSnapshot', 'OrchardLegacyBoundary', 'OrchardTransactionReader', 'OrchardTransparent']:
              raise SystemExit(f'Wrong root Orchard inventory: {names}')
          for test in tests:
              props = {p['name']: p['value'] for p in test.get('properties', [])}
              if props.get('DISABLED') or 'orchard' not in props.get('LABELS', []):
                  raise SystemExit(f'Inactive or mislabeled root test: {test["name"]}')
          PYCODE
          ctest --test-dir build-orchard-root -R '^(OrchardBackend(Cpp|Rust)|OrchardTransactionReader|OrchardCoinSnapshot|OrchardTransparent|OrchardLegacyBoundary)$' --output-on-failure --no-tests=error
      - name: Retain root integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orchard-root-${{ github.sha }}
          path: |
            orchard-root-source.txt
            orchard-root-inventory.json
            build-orchard-root/CMakeCache.txt
            build-orchard-root/Testing/Temporary/LastTest.log
            build-orchard-root/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: error
