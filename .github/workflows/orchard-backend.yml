name: Orchard backend component
on:
  push:
    branches: [main, dinero-main, 'codex/**']
    paths:
      - 'rust/orchard_backend/**'
      - '.github/workflows/orchard-backend.yml'
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'cmake/**'
      - 'depends/**'
      - '.gitmodules'
      - 'third_party/**'
      - 'scripts/build-openssl-vendored.sh'
  pull_request:
    paths:
      - 'rust/orchard_backend/**'
      - '.github/workflows/orchard-backend.yml'
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'cmake/**'
      - 'depends/**'
      - '.gitmodules'
      - 'third_party/**'
      - 'scripts/build-openssl-vendored.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orchard-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    name: Orchard pinned dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read pinned compiler
        id: rust-pin
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('rust/orchard_backend/rust-toolchain.toml', 'rb') as f:
              print('version=' + tomllib.load(f)['toolchain']['channel'])
          PYCODE
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - name: Install exact audit tool with its locked dependencies
        run: |
          cargo +${{ steps.rust-pin.outputs.version }} install cargo-audit --version 0.22.2 --locked --jobs 2 --root build-orchard-audit-tools
          build-orchard-audit-tools/bin/cargo-audit --version > orchard-audit-tool.txt
      - name: Audit committed graph against fresh advisories
        run: |
          set +e
          build-orchard-audit-tools/bin/cargo-audit audit --file rust/orchard_backend/Cargo.lock --db build-orchard-advisory-db --deny unsound --deny yanked --format json > orchard-dependency-audit.json
          audit_status=$?
          set -e
          printf '%s\n' "$audit_status" > orchard-dependency-audit-exit.txt
          git -C build-orchard-advisory-db rev-parse HEAD > orchard-advisory-db-head.txt
          git rev-parse HEAD > orchard-audit-source.txt
          sha256sum rust/orchard_backend/Cargo.lock > orchard-audit-lock-sha256.txt
          exit "$audit_status"
      - name: Display informational maintenance warnings
        if: always()
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = Path('orchard-dependency-audit.json')
          print('## Orchard dependency audit')
          print('Gate: known vulnerabilities, unsoundness advisories, yanked crates, and scanner errors fail. Maintenance notices remain visible below; they are not a cryptographic review.')
          data = json.loads(report.read_text())
          for kind, entries in data.get('warnings', {}).items():
              for entry in entries:
                  package, advisory = entry['package'], entry.get('advisory') or {}
                  print(f"- {kind}: {package['name']} {package['version']} — {advisory.get('id', '')} {advisory.get('title', '')}")
          PYCODE
      - name: Retain audit evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orchard-dependency-audit-${{ github.sha }}
          path: |
            orchard-audit-tool.txt
            orchard-audit-source.txt
            orchard-audit-lock-sha256.txt
            orchard-advisory-db-head.txt
            orchard-dependency-audit.json
            orchard-dependency-audit-exit.txt
            rust/orchard_backend/Cargo.lock
          if-no-files-found: error
  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize pinned transparent-signature library
        run: git submodule update --init third_party/secp256k1-zkp
      - name: Read pinned compiler
        id: rust-pin
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('rust/orchard_backend/rust-toolchain.toml', 'rb') as f:
              print('version=' + tomllib.load(f)['toolchain']['channel'])
          PYCODE
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action, explicit compiler below
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          components: rustfmt, clippy
      - name: Install native crypto and wallet storage dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev
      - name: Record exact source and compiler
        run: |
          git rev-parse HEAD
          rustc --version
          cmake --version
      - name: Format and lint pinned dependency graph
        run: |
          cargo +${{ steps.rust-pin.outputs.version }} fmt --manifest-path rust/orchard_backend/Cargo.toml -- --check
          cargo +${{ steps.rust-pin.outputs.version }} clippy --locked --release --manifest-path rust/orchard_backend/Cargo.toml --target-dir build-orchard-backend/cargo --all-targets -- -D warnings
      - name: Check independent envelope vectors
        run: |
          python3 rust/orchard_backend/tests/make_envelope_vector.py --check
          python3 rust/orchard_backend/tests/make_transparent_vector.py --check
          python3 rust/orchard_backend/tests/check_combined_vectors.py
      - name: Build C++ and Rust together
        run: |
          cmake -S rust/orchard_backend -B build-orchard-backend -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-orchard-backend --parallel 2
      - name: Require all executable test lanes
        run: |
          ctest --test-dir build-orchard-backend --show-only=json-v1 > orchard-test-inventory.json
          python3 - <<'PY'
          import json
          tests = {x['name'] for x in json.load(open('orchard-test-inventory.json'))['tests']}
          if tests != {'OrchardAuthorization', 'OrchardBackendCpp', 'OrchardBackendRust', 'OrchardTransactionReader', 'OrchardCoinSnapshot', 'OrchardTransparent', 'OrchardStateTransition', 'OrchardWalletKeys', 'OrchardWalletShield', 'OrchardWalletSpend', 'OrchardWalletStorage'}:
              raise SystemExit(f'wrong Orchard test inventory: {tests}')
          PY
          ctest --test-dir build-orchard-backend --output-on-failure --no-tests=error
      - name: Retain component evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orchard-backend-${{ github.sha }}
          path: |
            orchard-test-inventory.json
            build-orchard-backend/Testing/Temporary/LastTest.log
            build-orchard-backend/Testing/Temporary/LastTestsFailed.log
            rust/orchard_backend/Cargo.lock
          if-no-files-found: error

  root-linux:
    name: Orchard through root build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Install root build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 perl ripgrep \
            libcurl4-openssl-dev libudev-dev libusb-1.0-0-dev libsqlite3-dev
      - name: Read pinned compiler
        id: rust-pin
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('rust/orchard_backend/rust-toolchain.toml', 'rb') as f:
              print('version=' + tomllib.load(f)['toolchain']['channel'])
          PYCODE
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - name: Build root prerequisites
        run: |
          OPENSSL_VERSION=3.5.7 bash scripts/build-openssl-vendored.sh
          cmake -S depends -B depends/build
          cmake --build depends/build --parallel 2
      - name: Configure root with Orchard enabled
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          git rev-parse HEAD > orchard-root-source.txt
          cmake -S . -B build-orchard-root -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DDINERO_REPRODUCIBLE_BUILD=ON -DDINERO_ROCKSDB_BUILD_JOBS=2 \
            -DDINERO_USE_VENDORED_DEPS=ON -DENABLE_GRPC=OFF \
            -DDINERO_BUILD_ORCHARD_BACKEND=ON -DDINERO_ORCHARD_BUILD_TESTS=ON \
            -DBUILD_TESTING=ON
      - name: Build daemon and root Orchard targets
        run: |
          cmake --build build-orchard-root --target dinerod test_utxo_publication test_orchard_backend test_orchard_wallet test_orchard_wallet_shield test_orchard_wallet_spend test_orchard_wallet_storage test_orchard_wallet_scan test_orchard_operation_queue test_orchard_proof_jobs test_orchard_wallet_account test_orchard_chain_restore test_orchard_operation_archive test_orchard_transaction_reader test_orchard_coin_snapshot test_orchard_transparent test_orchard_authorization test_orchard_state_transition test_orchard_block_reader test_orchard_block_coins test_orchard_resources test_orchard_block_filter test_orchard_header test_orchard_forest_transition test_orchard_block_staging test_orchard_state_storage test_orchard_legacy_boundary test_block_storage_roundtrip test_archival_block_reader --parallel 2
          ./build-orchard-root/dinerod --version
      - name: Require and execute all root Orchard lanes
        run: |
          ctest --test-dir build-orchard-root -R '^(OrchardAuthorization|OrchardBackend(Cpp|Rust)|OrchardTransactionReader|OrchardCoinSnapshot|OrchardTransparent|OrchardStateStorage|OrchardStateTransition|OrchardForestTransition|OrchardBlockCoins|OrchardHeader|OrchardBlockReader|OrchardBlockStaging|OrchardAtomicCrash|OrchardMemoryPublication|OrchardWalletKeys|OrchardWalletShield|OrchardWalletSpend|OrchardWalletStorage|OrchardWalletAccount|OrchardChainRestore|OrchardOperationArchive|OrchardWalletOperations|OrchardProofJobs|OrchardResources|OrchardBlockFilter|OrchardWalletScan|OrchardLegacyBoundary)$' --show-only=json-v1 > orchard-root-inventory.json
          python3 - <<'PYCODE'
          import json
          with open('orchard-root-inventory.json') as f:
              tests = json.load(f)['tests']
          names = [x['name'] for x in tests]
          if sorted(names) != ['OrchardAtomicCrash', 'OrchardAuthorization', 'OrchardBackendCpp', 'OrchardBackendRust', 'OrchardBlockCoins', 'OrchardBlockFilter', 'OrchardBlockReader', 'OrchardBlockStaging', 'OrchardChainRestore', 'OrchardCoinSnapshot', 'OrchardForestTransition', 'OrchardHeader', 'OrchardLegacyBoundary', 'OrchardMemoryPublication', 'OrchardOperationArchive', 'OrchardProofJobs', 'OrchardResources', 'OrchardStateStorage', 'OrchardStateTransition', 'OrchardTransactionReader', 'OrchardTransparent', 'OrchardWalletAccount', 'OrchardWalletKeys', 'OrchardWalletOperations', 'OrchardWalletScan', 'OrchardWalletShield', 'OrchardWalletSpend', 'OrchardWalletStorage']:
              raise SystemExit(f'Wrong root Orchard inventory: {names}')
          for test in tests:
              props = {p['name']: p['value'] for p in test.get('properties', [])}
              if props.get('DISABLED') or 'orchard' not in props.get('LABELS', []):
                  raise SystemExit(f'Inactive or mislabeled root test: {test["name"]}')
          PYCODE
          ctest --test-dir build-orchard-root -R '^(OrchardAuthorization|OrchardBackend(Cpp|Rust)|OrchardTransactionReader|OrchardCoinSnapshot|OrchardTransparent|OrchardStateStorage|OrchardStateTransition|OrchardForestTransition|OrchardBlockCoins|OrchardHeader|OrchardBlockReader|OrchardBlockStaging|OrchardAtomicCrash|OrchardMemoryPublication|OrchardWalletKeys|OrchardWalletShield|OrchardWalletSpend|OrchardWalletStorage|OrchardWalletAccount|OrchardChainRestore|OrchardOperationArchive|OrchardWalletOperations|OrchardProofJobs|OrchardResources|OrchardBlockFilter|OrchardWalletScan|OrchardLegacyBoundary)$' --output-on-failure --no-tests=error --output-log orchard-root-execution.log
      - name: Require and execute shared flatfile compatibility lanes
        run: |
          ctest --test-dir build-orchard-root -R '^(BlockStorageRoundTrip|ArchivalBlockReader)$' --show-only=json-v1 > orchard-flatfile-inventory.json
          python3 - <<'PYCODE'
          import json
          tests = json.load(open('orchard-flatfile-inventory.json'))['tests']
          if sorted(t['name'] for t in tests) != ['ArchivalBlockReader', 'BlockStorageRoundTrip']:
              raise SystemExit('Missing shared flatfile compatibility test')
          for test in tests:
              props = {p['name']: p['value'] for p in test.get('properties', [])}
              if props.get('DISABLED'):
                  raise SystemExit('Disabled shared flatfile compatibility test')
          PYCODE
          ctest --test-dir build-orchard-root -R '^(BlockStorageRoundTrip|ArchivalBlockReader)$' --output-on-failure --no-tests=error --output-log orchard-flatfile-execution.log
      - name: Retain root integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orchard-root-${{ github.sha }}
          path: |
            orchard-root-source.txt
            orchard-root-inventory.json
            orchard-root-execution.log
            orchard-flatfile-inventory.json
            orchard-flatfile-execution.log
            build-orchard-root/CMakeCache.txt
            build-orchard-root/Testing/Temporary/LastTest.log
            build-orchard-root/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: error
