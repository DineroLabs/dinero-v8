# Diagnostic only. Builds the exact pre-extraction base and prints MP4
# candidates for review. It does not upload files, sign, or publish anything.
name: Mempool Windows exact-base references

on:
  push:
    branches: [codex/mempool-windows-baseline]

permissions:
  contents: read

concurrency:
  group: mempool-windows-baseline-${{ github.ref }}
  cancel-in-progress: true

env:
  MP_CMAKE_VERSION: '4.3.4'
  MP_NINJA_VERSION: '1.13.2'

jobs:
  record:
    name: Windows exact base Orchard ${{ matrix.orchard }}
    runs-on: windows-2022
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        orchard: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Require the reviewed pre-extraction source
        shell: pwsh
        run: |
          $expected = '3d84b96fdeb6406e540a4649cd4ed98d475231d3'
          $mergeBase = (git merge-base HEAD $expected).Trim()
          if ($mergeBase -ne $expected) { throw "Wrong base: merge-base=$mergeBase expected=$expected" }
          $allowed = @('.github/workflows/mempool-windows-baseline.yml',
                       'tests/mempool_separation/mempool_transcript.py')
          $changed = @(git diff --name-only $expected HEAD)
          foreach ($path in $changed) {
            if ($path -notin $allowed) { throw "Diagnostic branch changed product source: $path" }
          }
          Write-Host "Pre-extraction parent: $expected"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "cmake==$env:MP_CMAKE_VERSION" "ninja==$env:MP_NINJA_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Keep pinned tools ahead of Visual Studio's copies
        shell: pwsh
        run: |
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          "$scripts" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $env:PATH = $scripts + [IO.Path]::PathSeparator + $env:PATH
          if (@(cmake --version)[0] -ne "cmake version $env:MP_CMAKE_VERSION") {
            throw 'Pinned CMake was not selected'
          }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Install source-pinned Orchard compiler
        shell: pwsh
        run: |
          $pin = python -c "import tomllib; print(tomllib.load(open('rust/orchard_backend/rust-toolchain.toml','rb'))['toolchain']['channel'])"
          rustup toolchain install "$pin" --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build vendored OpenSSL and curl
        shell: powershell
        run: |
          $env:OPENSSL_VERSION = '3.5.7'
          .\scripts\build-openssl-vendored.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\build-curl-vendored.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Provision Windows curl
        shell: powershell
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install curl:x64-windows --no-print-usage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build reachability dependencies
        shell: powershell
        run: |
          cmake -S depends -B depends\build-msvc -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$PWD\depends\toolchains\windows-msvc-x64.cmake" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DDINERO_DEPENDS_HOST=windows-AMD64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build depends\build-msvc --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefix = (Select-String -Path 'depends\current-prefix.env' `
              -Pattern '^DINERO_DEPENDS_PREFIX=(.*)$').Matches[0].Groups[1].Value
          "DINERO_DEPENDS_PREFIX=$prefix" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
      - name: Configure exact-base daemon
        shell: pwsh
        env:
          MP_ORCHARD: ${{ matrix.orchard }}
        run: |
          $configureArgs = @(
            '-S', '.', '-B', 'build-mp4-base', '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_C_COMPILER=cl', '-DCMAKE_CXX_COMPILER=cl',
            '-DDINERO_USE_VENDORED_DEPS=ON', '-DENABLE_GRPC=OFF',
            '-DBUILD_NODECORE=OFF', '-DENABLE_TESTS=OFF',
            '-DDINERO_WINDOWS_SERVER_BUILD=ON', '-DDINERO_BUILD_MINER=OFF',
            "-DDINERO_BUILD_ORCHARD_BACKEND=$env:MP_ORCHARD",
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          )
          if ($env:MP_ORCHARD -eq 'ON') { $configureArgs += '-DDINERO_ORCHARD_WINDOWS_QUALIFICATION=ON' }
          & cmake @configureArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build exact-base dinerod
        shell: pwsh
        run: |
          cmake --build build-mp4-base --target dinerod --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record candidate and print it for review
        shell: pwsh
        env:
          MP_ORCHARD: ${{ matrix.orchard }}
        run: |
          $cfg = $env:MP_ORCHARD.ToLowerInvariant()
          $candidate = Join-Path $env:RUNNER_TEMP "windows_$cfg.json"
          $daemon = Get-ChildItem -Path 'build-mp4-base' -Recurse -Filter 'dinerod.exe' |
            Select-Object -First 1
          if (-not $daemon) { throw 'Exact-base dinerod.exe was not built' }
          python tests/mempool_separation/mempool_transcript.py record `
            --dinerod $daemon.FullName `
            --config $cfg --out $candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha256 = (Get-FileHash -Algorithm SHA256 $candidate).Hash.ToLowerInvariant()
          Write-Host "MP4 Windows exact-base candidate: orchard=$cfg sha256=$sha256"
          Get-Content -Raw $candidate | Write-Host
