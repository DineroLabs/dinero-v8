name: Windows signed package qualification
on:
  push:
    branches: [ci/v820-signed-windows-package-qualification]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  signed-packages:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-candidate-failure-42108289368
          run-id: 42108289368
          github-token: ${{ github.token }}
          path: signed-input
      - name: Qualify exact signed installers and their portable wallet
        shell: powershell
        run: |
          python .github/qualification/qualify_signed_windows_packages.py
          if ($LASTEXITCODE -ne 0) { throw 'Signed Windows package qualification failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualified-signed-windows-249b
          path: qualified-windows
          if-no-files-found: error
