name: Windows OpenSSL Release Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-openssl-release-smoke.yml'
      - 'cmake/ThirdParty.cmake'
      - 'scripts/build-openssl-vendored.ps1'
      - 'scripts/ci/check_openssl_version.ps1'
      - 'packaging/windows/**'

jobs:
  windows-openssl-release-smoke:
    name: Windows MSVC — OpenSSL 3.5.7 build, daemon, installer
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache vendored OpenSSL
        uses: actions/cache@v4
        with:
          path: |
            third_party/openssl-3.5.7
          key: windows-msvc-openssl-3.5.7-${{ hashFiles('scripts/build-openssl-vendored.ps1') }}

      - name: Build vendored OpenSSL 3.5.7
        shell: powershell
        run: |
          $env:OPENSSL_VERSION = '3.5.7'
          .\scripts\build-openssl-vendored.ps1

      # Must run after the OpenSSL build (it links the vendored static OpenSSL)
      # and before the installer build. cmake/VendoredCurl.cmake hard-fails the
      # configure when third_party/curl-*/prebuilt/windows-x86_64-msvc is absent,
      # so without this step CI dies at "Build Windows server release and
      # installer" on a clean checkout, even though a developer machine that had
      # already run this script by hand builds fine.
      - name: Build vendored static libcurl (OpenSSL 3.5.7)
        shell: powershell
        run: |
          $env:OPENSSL_VERSION = '3.5.7'
          .\scripts\build-curl-vendored.ps1

      - name: Install NSIS
        shell: powershell
        run: choco install nsis --no-progress -y

      - name: Build Windows server release and installer
        shell: powershell
        run: |
          .\packaging\windows\build-server-installer.ps1 `
            -Version '8.0.18-openssl357-ci' `
            -BuildDir 'build-msvc-server'

      - name: Assert the linked OpenSSL version
        shell: powershell
        run: |
          .\scripts\ci\check_openssl_version.ps1 `
            -BuildDir 'build-msvc-server' `
            -ExpectedVersion '3.5.7'

      - name: Daemon startup, mining, and restart smoke
        shell: powershell
        run: |
          .\scripts\native-msvc-regtest-smoke.ps1 `
            -BuildDir 'build-msvc-server\Release' `
            -TimeoutSeconds 90

      - name: Silent installer and uninstall smoke
        shell: powershell
        run: |
          $installer = Resolve-Path 'packaging\windows\dist\Dinero-Server-8.0.18-openssl357-ci-windows-x86_64-Setup.exe'
          $installDir = Join-Path $env:ProgramFiles 'Dinero-Server'

          $install = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "silent installer exited with code $($install.ExitCode)"
          }
          foreach ($name in @('dinerod.exe', 'dinero-cli.exe', 'Uninstall.exe')) {
            $path = Join-Path $installDir $name
            if (-not (Test-Path $path)) {
              throw "installer did not produce $path"
            }
          }

          $installedVersion = & (Join-Path $installDir 'dinerod.exe') --version 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "installed dinerod --version failed: $installedVersion"
          }
          Write-Host $installedVersion

          $uninstall = Start-Process `
            -FilePath (Join-Path $installDir 'Uninstall.exe') `
            -ArgumentList '/S' `
            -Wait `
            -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "silent uninstall exited with code $($uninstall.ExitCode)"
          }
          if (Test-Path (Join-Path $installDir 'dinerod.exe')) {
            throw "silent uninstall left dinerod.exe installed"
          }

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-server-openssl-3.5.7-smoke
          path: packaging/windows/dist/Dinero-Server-8.0.18-openssl357-ci-windows-x86_64-Setup.exe
          if-no-files-found: warn
