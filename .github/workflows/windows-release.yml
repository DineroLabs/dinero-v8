name: Windows Release

# Windows release artifact lane.
#
# Until v8.1.1 there was no Windows *release* workflow — only
# windows-openssl-release-smoke.yml, which builds the same installer but is
# dispatch/PR only, hardcodes a CI version string, and uploads the result as a
# throwaway workflow artifact. A tagged release therefore produced macOS
# artifacts and nothing for Windows.
#
# This lane mirrors macos-release.yml: gated to release tags (plus manual
# dispatch), derives the version from the tag, and attaches the installer and
# its SHA256SUMS to the GitHub release.
#
# The smoke workflow stays as-is: it guards the Windows build against changes
# to packaging/OpenSSL/curl scripts on PRs, which is a different job from
# cutting a release.

on:
  push:
    tags: ['v8.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach artifacts to (blank = artifacts only)'
        required: false
        type: string

permissions:
  contents: write        # required to attach artifacts to the release

env:
  SV2_REF: 8f9d7f688080483fbeb2f62b234031d5d5567ec5

jobs:
  windows-release:
    name: Windows MSVC x86_64 — release installer
    runs-on: windows-2022
    timeout-minutes: 120
    # `release` environment carries the Azure OIDC federation for Windows
    # code signing (subject repo:DineroLabs/dinero-v8:environment:release).
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A manual recovery run must still build the immutable release tag,
          # not whichever commit happens to be at the selected workflow ref.
          ref: ${{ inputs.release_tag || github.ref }}
          submodules: recursive

      # Strip the leading "v" from the tag; fall back to the dispatch input,
      # else a dev marker so an unflagged run never embeds an empty version.
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            V="${{ inputs.release_tag }}"; V="${V#v}"
            TAG="${{ inputs.release_tag }}"
          else
            V="0.0.0-dev"
            TAG=""
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building Windows release for version: $V"

      - name: Require Authenticode signing for a release cut
        if: steps.ver.outputs.release_tag != ''
        shell: bash
        run: |
          test "${{ vars.WINDOWS_SIGNING_READY }}" = true || {
            echo 'WINDOWS_SIGNING_READY must be true for release artifacts' >&2
            exit 1
          }

      # Draft-release assets are intentionally unavailable through the public
      # /releases/download/<tag>/ URL. Fetch them through authenticated GitHub
      # access so the Windows installer can be built and tested before the
      # release is published.
      - name: Fetch snapshot assets from draft release
        if: steps.ver.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p packaging/windows/dist
          gh release download "${{ steps.ver.outputs.release_tag }}" \
            --pattern 'dinero-assumeutxo-84131-v4.dat' \
            --pattern 'dinero-assumeutxo-84131-v4.manifest.json' \
            --dir packaging/windows/dist \
            --clobber

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.9.1 (MSVC 2022 x86_64)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.9.1'
          arch: win64_msvc2022_64
          cache: true

      - name: Checkout pinned SV2 miners
        uses: actions/checkout@v4
        with:
          repository: DineroLabs/dinero-sv2
          ref: ${{ env.SV2_REF }}
          path: dinero-sv2

      - name: Verify exact source provenance
        shell: bash
        run: |
          if [ -n '${{ steps.ver.outputs.release_tag }}' ]; then
            test "$(git rev-parse HEAD)" = "$(git rev-list -n1 '${{ steps.ver.outputs.release_tag }}')"
          fi
          test "$(git -C dinero-sv2 rev-parse HEAD)" = "$SV2_REF"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenCL import library for the SV2 GPU miner
        shell: powershell
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install opencl:x64-windows --no-print-usage
          $openclRoot = Join-Path $env:RUNNER_TEMP 'opencl-sdk'
          New-Item (Join-Path $openclRoot 'lib\x64') -ItemType Directory -Force | Out-Null
          Copy-Item `
            "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\OpenCL.lib" `
            (Join-Path $openclRoot 'lib\x64\OpenCL.lib')
          # cl-sys 0.4.3 only recognizes vendor SDK root variables and appends
          # lib\x64 itself; it does not honor a generic OPENCL_LIB_DIR.
          "INTELOCLSDKROOT=$openclRoot" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Build pinned SV2 miners
        working-directory: dinero-sv2
        # Git Bash resolves `link.exe` to its Unix /usr/bin/link shim even
        # after msvc-dev-cmd. PowerShell preserves MSVC's linker precedence.
        shell: powershell
        run: cargo build --release --locked

      - name: Cache vendored OpenSSL
        uses: actions/cache@v4
        with:
          path: |
            third_party/openssl-3.5.7
          key: windows-msvc-openssl-3.5.7-${{ hashFiles('scripts/build-openssl-vendored.ps1') }}

      - name: Build vendored OpenSSL 3.5.7
        shell: powershell
        run: |
          $env:OPENSSL_VERSION = '3.5.7'
          .\scripts\build-openssl-vendored.ps1

      - name: Build vendored curl
        shell: powershell
        run: |
          $env:OPENSSL_VERSION = '3.5.7'
          .\scripts\build-curl-vendored.ps1

      - name: Install NSIS
        shell: powershell
        run: choco install nsis --no-progress -y

      # The GitHub runner keeps vcpkg at VCPKG_INSTALLATION_ROOT with no
      # packages installed, so configure would die at find_package(CURL).
      - name: Provision curl via runner vcpkg
        shell: powershell
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install curl:x64-windows --no-print-usage

      - name: Build complete Windows desktop stack
        shell: powershell
        run: |
          cmake -S . -B build-msvc-native -G 'Visual Studio 17 2022' -A x64 `
            -DDINERO_BUILD_QT=ON `
            -DDINERO_BUILD_MINER=ON `
            -DDINERO_BUILD_SEEDER=ON `
            -DENABLE_GPU_MINING=ON `
            -DENABLE_GRPC=OFF `
            -DDINERO_ENABLE_QUIC=ON `
            -DDINERO_RELEASE_TAG='${{ steps.ver.outputs.version }}' `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'desktop configure failed' }
          cmake --build build-msvc-native --config Release --parallel 2 --target `
            dinerod dinero-cli dinero-qt dinero-miner dinero-stratum-worker `
            dinero-wallet-cli dinero-gpu-miner dinero-solo-miner-cli dinero-seeder
          if ($LASTEXITCODE -ne 0) { throw 'desktop build failed' }
          @(
            'build-msvc-native\Release\dinerod.exe',
            'build-msvc-native\bin\Release\dinero-qt.exe'
          ) | ForEach-Object {
            if (-not (Test-Path $_ -PathType Leaf)) {
              throw "expected desktop build output is missing: $_"
            }
          }

      - name: Build Windows server release and installer
        shell: powershell
        run: |
          .\packaging\windows\build-server-installer.ps1 `
            -Version '${{ steps.ver.outputs.version }}' `
            -BuildDir 'build-msvc-server' `
            -VcpkgRoot "$env:VCPKG_INSTALLATION_ROOT" `
            -VcpkgBin "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"

      - name: Stage GUI installer and portable operator archive
        shell: powershell
        run: |
          .\packaging\windows\build-installer.ps1 `
            -Version '${{ steps.ver.outputs.version }}' `
            -DaemonBuildDir 'build-msvc-native\Release' `
            -QtBuildDir 'build-msvc-native\bin\Release' `
            -QtBin "$env:QT_ROOT_DIR\bin" `
            -Sv2BuildDir 'dinero-sv2\target\release' `
            -SnapshotPath 'packaging\windows\dist\dinero-assumeutxo-84131-v4.dat' `
            -SnapshotManifestPath 'packaging\windows\dist\dinero-assumeutxo-84131-v4.manifest.json'

      # Policy pin. A release that silently linked a different OpenSSL than the
      # one the Linux/macOS lanes assert would be a supply-chain divergence.
      - name: Assert the linked OpenSSL version
        shell: powershell
        run: |
          .\scripts\ci\check_openssl_version.ps1 `
            -BuildDir 'build-msvc-native' `
            -ExpectedVersion '3.5.7'
          .\scripts\ci\check_openssl_version.ps1 `
            -BuildDir 'build-msvc-server' `
            -ExpectedVersion '3.5.7'

      - name: Daemon startup, mining, and restart smoke
        shell: powershell
        run: |
          .\scripts\native-msvc-regtest-smoke.ps1 `
            -BuildDir 'build-msvc-server\Release' `
            -TimeoutSeconds 90

      # Authenticode signing via Azure Artifact Signing (publisher:
      # Microsoft-ID-verified). Gated on the WINDOWS_SIGNING_READY repo
      # variable so the lane still releases (unsigned) if the signing
      # service is ever unavailable. MUST run before the checksum step —
      # signing changes the installer's bytes.
      - name: Azure login (OIDC)
        if: ${{ vars.WINDOWS_SIGNING_READY == 'true' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Sign the actual staged payloads before NSIS and ZIP creation. Signing
      # only the outer installer leaves every installed executable and Qt DLL
      # unsigned, which is not an acceptable Windows release.
      - name: Temporarily remove Microsoft redistributable from signing stages
        if: ${{ vars.WINDOWS_SIGNING_READY == 'true' }}
        shell: powershell
        run: |
          Move-Item packaging\windows\dist\installer-stage\vc_redist.x64.exe packaging\windows\dist\vc_redist.gui.exe
          Move-Item packaging\windows\dist\server-installer-stage\vc_redist.x64.exe packaging\windows\dist\vc_redist.server.exe

      - name: Sign GUI payload executables and DLLs
        if: ${{ vars.WINDOWS_SIGNING_READY == 'true' }}
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\packaging\windows\dist\installer-stage
          files-folder-filter: exe,dll
          files-folder-recurse: true

      - name: Sign server payload executables and DLLs
        if: ${{ vars.WINDOWS_SIGNING_READY == 'true' }}
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\packaging\windows\dist\server-installer-stage
          files-folder-filter: exe,dll
          files-folder-recurse: true

      - name: Restore redistributables and build packages from signed payloads
        shell: powershell
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          if (Test-Path packaging\windows\dist\vc_redist.gui.exe) {
            Move-Item packaging\windows\dist\vc_redist.gui.exe packaging\windows\dist\installer-stage\vc_redist.x64.exe -Force
          }
          if (Test-Path packaging\windows\dist\vc_redist.server.exe) {
            Move-Item packaging\windows\dist\vc_redist.server.exe packaging\windows\dist\server-installer-stage\vc_redist.x64.exe -Force
          }
          $numericVersion = if ($version -match '^(\d+)\.(\d+)\.(\d+)') { "$($Matches[1]).$($Matches[2]).$($Matches[3]).0" } else { '0.0.0.0' }
          Push-Location packaging\windows
          try {
            & 'C:\Program Files (x86)\NSIS\makensis.exe' "/DVERSION=$version" "/DVERSION_NUMERIC=$numericVersion" dinero-installer.nsi
            if ($LASTEXITCODE -ne 0) { throw 'GUI NSIS rebuild failed' }
            & 'C:\Program Files (x86)\NSIS\makensis.exe' "/DVERSION=$version" "/DVERSION_NUMERIC=$numericVersion" "/DSNAPSHOT_FILE=dinero-assumeutxo-84131-v4.dat" dinero-server-installer.nsi
            if ($LASTEXITCODE -ne 0) { throw 'server NSIS rebuild failed' }
          } finally { Pop-Location }

          $zipStage = "packaging\windows\dist\dinero-v$version-windows-x86_64-msvc"
          if (Test-Path $zipStage) { Remove-Item $zipStage -Recurse -Force }
          New-Item "$zipStage\bin" -ItemType Directory -Force | Out-Null
          $operatorBinaries = @(
            'dinerod.exe', 'dinero-cli.exe', 'dinero-miner.exe',
            'dinero-stratum-worker.exe', 'dinero-gpu-miner.exe',
            'dinero-wallet-cli.exe', 'dinero-seeder.exe',
            'dinero-sv2-miner.exe', 'dinero-sv2-gpu-miner.exe'
          )
          foreach ($name in $operatorBinaries) {
            $source = Join-Path 'packaging\windows\dist\installer-stage' $name
            if (-not (Test-Path $source)) { throw "signed operator payload is missing $name" }
            Copy-Item $source "$zipStage\bin"
          }
          Copy-Item LICENSE $zipStage
          'Dinero signed Windows operator archive' | Out-File "$zipStage\README.txt" -Encoding ascii
          Push-Location $zipStage
          try {
            Get-ChildItem -Recurse -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object FullName | ForEach-Object {
              $relative = Resolve-Path -Relative $_.FullName
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($relative.TrimStart('.\\') -replace '\\','/')"
            } | Out-File SHA256SUMS.txt -Encoding ascii
          } finally { Pop-Location }
          Compress-Archive -Path "$zipStage\*" -DestinationPath "packaging\windows\dist\dinero-v$version-windows-x86_64-msvc.zip" -Force

      - name: Sign final installers
        if: ${{ vars.WINDOWS_SIGNING_READY == 'true' }}
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\packaging\windows\dist
          files-folder-filter: exe

      - name: Verify Authenticode signatures on every shipped PE file
        if: ${{ vars.WINDOWS_SIGNING_READY == 'true' }}
        shell: powershell
        run: |
          $targets = @(
            Get-ChildItem packaging\windows\dist\installer-stage -Recurse -Include *.exe,*.dll -File
            Get-ChildItem packaging\windows\dist\server-installer-stage -Recurse -Include *.exe,*.dll -File | Where-Object Name -ne 'vc_redist.x64.exe'
            Get-Item packaging\windows\dist\Dinero-*-Setup.exe
          )
          $bad = $targets | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($bad) { $bad.FullName | Write-Error; throw 'unsigned or invalid Windows release payload' }
          Write-Host "Verified $($targets.Count) Authenticode-signed PE files"

      # Prove both final installers install their signed payloads and uninstall.
      - name: Silent GUI and server installer smoke
        shell: powershell
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          foreach ($case in @(
            @{ Installer = "packaging\windows\dist\Dinero-$version-windows-x86_64-Setup.exe"; Dir = (Join-Path $env:ProgramFiles 'Dinero'); Required = @('dinero-qt.exe','dinerod.exe','Uninstall.exe') },
            @{ Installer = "packaging\windows\dist\Dinero-Server-$version-windows-x86_64-Setup.exe"; Dir = (Join-Path $env:ProgramFiles 'Dinero-Server'); Required = @('dinerod.exe','dinero-cli.exe','Uninstall.exe') }
          )) {
            $install = Start-Process -FilePath (Resolve-Path $case.Installer) -ArgumentList '/S' -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "installer failed: $($case.Installer)" }
            foreach ($name in $case.Required) { if (-not (Test-Path (Join-Path $case.Dir $name))) { throw "missing installed $name" } }
            $uninstall = Start-Process -FilePath (Join-Path $case.Dir 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "uninstall failed: $($case.Installer)" }
          }

      - name: Checksum final Windows matrix
        id: sums
        shell: powershell
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $artifacts = @(
            "packaging\windows\dist\dinero-v$version-windows-x86_64-msvc.zip",
            "packaging\windows\dist\Dinero-$version-windows-x86_64-Setup.exe",
            "packaging\windows\dist\Dinero-Server-$version-windows-x86_64-Setup.exe"
          )
          $sumfile = "SHA256SUMS-windows-x86_64-$version"
          $artifacts | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $_)"
          } | Out-File -Encoding ascii $sumfile
          Get-Content $sumfile
          "artifacts<<EOF" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          $artifacts | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          "EOF" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          "sumfile=$sumfile"     | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dinero-server-windows-x86_64-${{ steps.ver.outputs.version }}
          path: |
            ${{ steps.sums.outputs.artifacts }}
            ${{ steps.sums.outputs.sumfile }}
          if-no-files-found: error

      - name: Attach to release
        if: steps.ver.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION='${{ steps.ver.outputs.version }}'
          gh release upload "${{ steps.ver.outputs.release_tag }}" \
            "packaging/windows/dist/dinero-v${VERSION}-windows-x86_64-msvc.zip" \
            "packaging/windows/dist/Dinero-${VERSION}-windows-x86_64-Setup.exe" \
            "packaging/windows/dist/Dinero-Server-${VERSION}-windows-x86_64-Setup.exe" \
            "${{ steps.sums.outputs.sumfile }}" \
            --clobber
