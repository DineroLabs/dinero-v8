name: Retention diagnosis
run-name: Retention reproduction only — does not qualify the full suite

on:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-full-build-ctest:
    name: Retention reproduction only
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            pkg-config \
            python3 \
            perl \
            libcurl4-openssl-dev \
            libudev-dev \
            libusb-1.0-0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.75.0

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: Tests-linux
          max-size: 1G

      - name: Cache vendored prerequisites
        uses: actions/cache@v4
        with:
          path: |
            third_party/openssl-3.5.7/prebuilt
            depends/sources
            depends/x86_64-pc-linux-gnu*
            ~/.cargo/registry
            ~/.cargo/git
            third_party/bulletproofs_ffi/target
            third_party/bulletproofs-ffi/target
          key: vendored-tests-${{ runner.os }}-${{ hashFiles('depends/CMakeLists.txt', 'depends/packages/*.cmake', 'scripts/build-openssl-vendored.sh', 'third_party/bulletproofs_ffi/Cargo.lock', 'third_party/bulletproofs-ffi/Cargo.lock') }}
          restore-keys: |
            vendored-tests-${{ runner.os }}-
            vendored-${{ runner.os }}-

      - name: Build vendored OpenSSL
        run: OPENSSL_VERSION=3.5.7 bash scripts/build-openssl-vendored.sh

      - name: Build depends
        run: |
          cmake -S depends -B depends/build
          cmake --build depends/build -j

      - name: CMake configure
        run: |
          cmake -S . -B build-tests \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDINERO_USE_VENDORED_DEPS=ON \
            -DENABLE_GRPC=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Verify generated C++20 compile commands
        run: cmake --build build-tests --target check_first_party_compile_commands_cxx20

      - name: Build retention reproduction binaries
        id: build
        run: cmake --build build-tests -j --target dinerod utreexo_retention_copy utreexo_checkpoint_mutator test_block_download_scheduler test_block_download_scheduler_restart_bootstrap test_block_download_scheduler_g6b

      - name: Verify scheduler retry and recovery regressions
        run: ctest --test-dir build-tests --no-tests=error --output-on-failure -R '^BlockDownloadScheduler'

      - name: Reproduce retention failure with unchanged assertions
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git log -1 --format=%P > evidence/parents.txt
          sha256sum build-tests/dinerod build-tests/utreexo_retention_copy > evidence/binaries.sha256
          KEEP_RETENTION_EVIDENCE=1 ctest --test-dir build-tests \
            --no-tests=error --output-on-failure -V -j1 \
            --repeat until-fail:8 -R '^CheckpointRetentionDaemon$' \
            --output-junit "$GITHUB_WORKSPACE/evidence/retention.xml" \
            2>&1 | tee evidence/retention.log

      - name: Collect only isolated test logs
        if: always()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil
          out=Path('evidence')
          out.mkdir(exist_ok=True)
          for root in Path('/tmp').glob('dinero_retention_daemon.*'):
              for p in root.iterdir():
                  if p.is_file() and not p.is_symlink() and p.suffix in ('.log','.stderr'):
                      target=out/root.name/p.relative_to(root)
                      target.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copyfile(p,target)
          PYTHON

      - name: Upload retention diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retention-diagnosis-${{ github.sha }}
          path: evidence/
          retention-days: 7
