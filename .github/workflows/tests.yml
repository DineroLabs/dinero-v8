# ─────────────────────────────────────────────────────────────────────────
# Test Workflow v2 — full build + ctest, Linux x86_64 only
# ─────────────────────────────────────────────────────────────────────────
#
# Purpose:
#   CI stays fast and checks the daemon build/link/smoke path.
#   This workflow is the deeper signal: build the full default target graph
#   and run ctest so source drops, test regressions, and non-daemon target
#   failures are visible before load-bearing architecture work continues.
#
# Rollout:
#   This workflow is intentionally not required at first. Let it soak on
#   dinero-main, document each exclusion/failure, then promote it after the
#   plan in docs/architecture/test-workflow-v2-plan.md is satisfied.
#
# ─────────────────────────────────────────────────────────────────────────

name: Tests

on:
  push:
    branches: [dinero-main]
  pull_request:
    branches: [dinero-main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-full-build-ctest:
    name: Linux x86_64 — full build + ctest
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            pkg-config \
            python3 \
            perl \
            libcurl4-openssl-dev \
            libudev-dev \
            libusb-1.0-0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.75.0

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.workflow }}-linux
          max-size: 1G

      - name: Cache vendored prerequisites
        uses: actions/cache@v4
        with:
          path: |
            third_party/openssl-3.5.7/prebuilt
            depends/sources
            depends/x86_64-pc-linux-gnu*
            ~/.cargo/registry
            ~/.cargo/git
            third_party/bulletproofs_ffi/target
            third_party/bulletproofs-ffi/target
          key: vendored-tests-${{ runner.os }}-${{ hashFiles('depends/CMakeLists.txt', 'depends/packages/*.cmake', 'scripts/build-openssl-vendored.sh', 'third_party/bulletproofs_ffi/Cargo.lock', 'third_party/bulletproofs-ffi/Cargo.lock') }}
          restore-keys: |
            vendored-tests-${{ runner.os }}-
            vendored-${{ runner.os }}-

      - name: Build vendored OpenSSL
        run: OPENSSL_VERSION=3.5.7 bash scripts/build-openssl-vendored.sh

      - name: Build depends
        run: |
          cmake -S depends -B depends/build
          cmake --build depends/build -j

      - name: CMake configure
        run: |
          cmake -S . -B build-tests \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDINERO_USE_VENDORED_DEPS=ON \
            -DENABLE_GRPC=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Full default build
        id: build
        run: cmake --build build-tests -j

      # CI integrity gate: every test registered with CTest in THIS build
      # configuration must have a runnable executable. A registered-but-
      # unbuilt test otherwise reports 'Not Run' (or vanishes behind a label
      # filter) and the repo silently advertises coverage that disappeared —
      # RelayTlsKeypair rotted to non-compiling exactly this way (PR #416).
      # Note the residual blind spot documented in the script: tests behind
      # feature flags that are OFF here (e.g. DINERO_ENABLE_QUIC) are not
      # registered at all and cannot be checked by this gate.
      - name: CTest integrity gate (registered => built)
        run: python3 scripts/ci/check_ctest_integrity.py build-tests

      # Assertion-integrity ratchet (issue #497). tests/CMakeLists.txt appends
      # -UNDEBUG (/UNDEBUG on MSVC) to the Release test graph, and the
      # AssertionsEnabled test fails at compile time and runtime if assertions
      # are ever disabled again. The source ratchet remains defense in depth
      # for ad-hoc/unregistered test builds and prevents new raw-assert debt.
      #
      # Existing assertions are grandfathered by a baseline file; this step
      # fails only when a PR ADDS raw assert() to a test, so the ~2,300-item
      # backlog can be migrated in risk order without blocking unrelated work.
      # The baseline may only shrink.
      - name: Test assertion ratchet (no new raw assert)
        run: python3 scripts/ci/check_test_assertions.py

      - name: OpenSSL version assertion (policy pin 3.5.7)
        run: bash scripts/ci/check_openssl_version.sh build-tests 3.5.7

      - name: Run ctest
        run: |
          # Initial v2 soak intentionally runs the stable full-build test subset.
          # Excluded labels are pre-existing runtime/integration harness debt
          # surfaced by the first full ctest pass; keep this list explicit so
          # future PRs can retire exclusions one category at a time.
          # --no-tests=error: a label filter that matches ZERO tests is a
          # silent-disappearance mode, not a pass.
          # --exclude-regex: the daemon-spawning e2e tests became unconditionally
          # registered in #428 and now run in their own serial step below. They
          # are excluded HERE by NAME, not by the 'e2e' label: five other tests
          # carry 'e2e' (WalletRestoreRescan, AssumeUtxoReplayE2E,
          # AssumeUtxoPromotionRace, AssumeUtxoForwardConnect) and excluding the
          # label would silently drop them. They also do not carry 'integration',
          # so the existing label list does not cover them.
          ctest --test-dir build-tests \
            --output-on-failure \
            --no-tests=error \
            --exclude-regex '^(ColdStartConsensus|MiningPolicyE2E|AssumeUtxoCorruptCheckpointRecovery)$' \
            --label-exclude 'integration|gate|release|canonicality|fuzz'

      # Serial e2e lane (issue #428, the covenant wallet lifecycle, the
      # targeted parallel-download regression, the CrossSeed header-refresh
      # regression plus its fast teardown-lifecycle guard, and the CSN
      # crash-atomicity/consecutive-reorg regressions). Most spawn real dinerod
      # processes, bind ports, and must not run concurrently with each other or
      # the suite above — hence -j1 and a separate step. The teardown guard is
      # included here so its exact name cannot silently disappear.
      #
      # Each test gets its OWN ctest invocation with --no-tests=error. That is
      # deliberate and stronger than one combined -R over all names: a combined
      # selection still passes when one test disappears, while per-test
      # invocations fail if any name vanishes from the registry.
      #
      # This is the third distinct guarantee in the chain:
      #   #417 integrity gate  — every REGISTERED test has a runnable executable
      #   unconditional CMake — every named test is registered without an
      #                          EXISTS/find_program disappearance path
      #   this step            — CI actually EXECUTES them, and a launch failure
      #                          is a failure (the GTEST_SKIPs are gone)
      # Runs whenever the BUILD succeeded, independent of whether an earlier
      # TEST step failed. Steps default to skipping once any prior step fails,
      # which meant a single unrelated failure in the main ctest step silently
      # skipped this entire lane — including CsnEpochResetCrashAtomicity and
      # CSNShieldedReorgInvertibility, the two highest-value shielded
      # lifecycle tests. Observed on dinero-main @06d723cc9: a FLAKY
      # AssumeUtxoPrebaseMempoolResolution turned the whole lane into a no-op,
      # and the only surface signal was a red X naming an unrelated test.
      # Coverage must not depend on every other test passing first.
      - name: Run serial e2e tests (daemon-spawning)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # Run EVERY test, then fail once at the end.
          #
          # This loop previously relied on the step's implicit `bash -e`, so the
          # FIRST failing test aborted every test after it. Observed on PR #644:
          # CSNShieldedReorgInvertibility failed 9th, and the remaining SIX --
          # AssumeUtxoCorruptCheckpointRecovery, ConsensusIntrospectionRpc,
          # ConnectTipRestartEquivalence, RecoveryMarkerRestartEquivalence and
          # RestartChurnBoringnessGate -- silently never ran. The only surface
          # signal was a red X naming one unrelated-looking test.
          #
          # That is the SAME failure class this step's own header describes
          # fixing at the step level ("a single unrelated failure ... silently
          # skipped this entire lane"), reproduced INSIDE the lane between
          # tests. Coverage must not depend on every earlier test passing.
          #
          # `|| true` is scoped to recording the result; the aggregated exit
          # below still fails the step, so this does not weaken the gate.
          set +e
          failed=""
          for t in ColdStartConsensus MiningPolicyE2E CovenantWalletMultinodeLifecycle ParallelBlockDownloadTargeted CrossSeedRestartReorgParity CrossSeedTeardownLifecycle UtreexoLiveReorgStateRestoration SnapshotFormatPolicyRuntime CsnEpochResetCrashAtomicity ShieldedNullifierCrashBoundary ShieldedPromotionBoundary ReconsiderRestartBoundary CSNShieldedReorgInvertibility AssumeUtxoCorruptCheckpointRecovery ConsensusIntrospectionRpc ConnectTipRestartEquivalence RecoveryMarkerRestartEquivalence RestartChurnBoringnessGate; do
            echo "=== $t ==="
            ctest --test-dir build-tests \
              --output-on-failure \
              --no-tests=error \
              -j1 \
              -R "^${t}$"
            if [ $? -ne 0 ]; then
              failed="${failed} ${t}"
            fi
          done
          set -e
          if [ -n "${failed}" ]; then
            echo "::error::serial e2e lane failures:${failed}"
            echo "serial e2e lane failures:${failed}" >&2
            exit 1
          fi
          echo "serial e2e lane: all 15 tests passed"

      # Fuzz-labelled consensus invariant tests (issue #486).
      #
      # ConsensusFuzzer and ConsensusUTXOSetFuzz are registered and build, but
      # carry the 'fuzz' label, which the main ctest step above excludes. The
      # result was that neither had EVER executed in CI: grepping a full Tests
      # log for "ConsensusFuzzer" returned zero hits. They were not skipped and
      # reported, they were never selected at all.
      #
      # Neither is slow -- both complete in well under a second -- so there was
      # never a runtime reason to exclude them. The label was doing it silently.
      #
      # Selected BY EXACT NAME rather than by removing the label, because the
      # label legitimately keeps them out of label-driven selections. Same
      # per-test --no-tests=error pattern as the serial lane above: a combined
      # -R would still pass if one of these names vanished from the registry.
      #
      # ConsensusFuzzer is still not selected here, but the reason has CHANGED
      # and is no longer "it fails".
      #
      # It originally failed on 5 of 40 fixed seeds (#490). That is fixed:
      # ConsensusUTXOSet now uses removeAtKnownPosition(), and a full
      # deterministic 1..40 sweep is 40/40 exit 0 with zero corruption markers.
      #
      # It stays out because its ctest registration takes NO arguments, so the
      # binary falls back to a TIME-BASED seed -- a different chain every run.
      # Adding a nondeterministic test to every push buys little and costs
      # reproducibility: a failure could not be replayed from the log.
      #
      # Deterministic coverage of the same binary is provided instead by
      # ConsensusUTXOSetTransactional, which drives seeds 1..40 explicitly and
      # requires exit 0 from each. To enable ConsensusFuzzer here, give its
      # add_test an explicit seed and iteration count first.
      - name: Run fuzz-labelled consensus invariant tests (excluded by label above)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          for t in ConsensusUTXOSetFuzz; do
            echo "=== $t ==="
            ctest --test-dir build-tests \
              --output-on-failure \
              --no-tests=error \
              -R "^${t}$"
          done

      # #490 seed pin, run VERBOSELY on purpose.
      #
      # It already runs in the main ctest step above, but ctest suppresses a
      # PASSING test's output under --output-on-failure. That makes the
      # forbidden-signature result unverifiable from the log: an absence of
      # those strings is produced equally by "the scan found nothing" and "the
      # scan never ran".
      #
      # -V forces the output, so the affirmative counters are visible in CI:
      #     forbidden lossy-restore signature scans: 120
      #     forbidden lossy-restore signatures: 0
      #
      # Costs a few seconds and makes the claim checkable rather than asserted.
      - name: "Verify issue-490 seed pin verbosely (log-visible forbidden-signature counts)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          ctest --test-dir build-tests \
            --no-tests=error \
            -V \
            -R '^ConsensusUTXOSetTransactional$'

      # #453 durable script-validity gate, plus the #458
      # mine-after-invalidate gates.
      #
      # These two carry the labels 'integration' and 'canonicality', both of
      # which the main ctest step above excludes. Without this step they are
      # REGISTERED but never EXECUTED — verified on the first CI run of PR #460,
      # where the configure log printed "✓ ScriptValidityDurability registered"
      # and "✓ ScriptValidityCrashOrdering registered" while neither name
      # appeared anywhere in "100% tests passed ... out of 382".
      #
      # A regression test that does not run is indistinguishable from no test.
      # That is the same silent-coverage failure #412 and #428 were opened for,
      # so the gate lands in the same commit series as the behaviour it protects
      # rather than as a follow-up.
      #
      # Deliberately NOT carrying --label-exclude: these are selected by exact
      # name, so the broad exclusions must not apply to them.
      #
      # Two separate invocations, not one '^(A|B)$' — a combined selection still
      # passes when only ONE survives, so it cannot prove BOTH are registered.
      # With --no-tests=error, either name disappearing fails the build.
      #
      # No retry and no until-pass wrapper: both spawn a real dinerod, and a
      # flaky-tolerant gate for a consensus durability property would be worse
      # than no gate at all.
      # NOTE: quoted — an unquoted '#' after whitespace starts a YAML comment,
      # which silently truncates this step's name to "Run".
      - name: "Run #453/#458 durability tests (daemon-spawning)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "=== ScriptValidityDurability ==="
          ctest --test-dir build-tests \
            --output-on-failure \
            --no-tests=error \
            -j1 \
            -R '^ScriptValidityDurability$'

          echo "=== ScriptValidityCrashOrdering ==="
          ctest --test-dir build-tests \
            --output-on-failure \
            --no-tests=error \
            -j1 \
            -R '^ScriptValidityCrashOrdering$'

          # #458 — same label-exclusion problem, same treatment.
          echo "=== MineAfterInvalidate ==="
          ctest --test-dir build-tests \
            --output-on-failure \
            --no-tests=error \
            -j1 \
            -R '^MineAfterInvalidate$'

          echo "=== MineAfterInvalidateRestart ==="
          ctest --test-dir build-tests \
            --output-on-failure \
            --no-tests=error \
            -j1 \
            -R '^MineAfterInvalidateRestart$'

          # #462 — same label-exclusion problem.
          echo "=== ForkBlockStatusRestart ==="
          ctest --test-dir build-tests \
            --output-on-failure \
            --no-tests=error \
            -j1 \
            -R '^ForkBlockStatusRestart$'

          # #453 reorg coverage — unblocked by #458 (mineable competing branch)
          # and #462 (fork-block status survives restart).
          echo "=== ScriptValidityReorg ==="
          ctest --test-dir build-tests \
            --output-on-failure \
            --no-tests=error \
            -j1 \
            -R '^ScriptValidityReorg$'

          # #458 RPC envelope contract — same label-exclusion problem.
          echo "=== RpcErrorEnvelope ==="
          ctest --test-dir build-tests \
            --output-on-failure \
            --no-tests=error \
            -j1 \
            -R '^RpcErrorEnvelope$'

          # Reorg event feed. Integration-labeled, so the main lane's
          # --label-exclude skips it; selected here by exact name.
          echo "=== ReorgEventFeed ==="
          ctest --test-dir build-tests \
            --output-on-failure \
            --no-tests=error \
            -j1 \
            -R '^ReorgEventFeed$'

          # #287 — the CSN wallet reorg regression is integration-labeled and
          # must execute serially by exact name rather than disappear behind
          # the main ctest label exclusions.
          echo "=== CsnSpendReorgReconciliation ==="
          ctest --test-dir build-tests \
            --output-on-failure \
            --no-tests=error \
            -j1 \
            -R '^CsnSpendReorgReconciliation$'

          # #321 — shielded wallet reject rollback is integration-labeled and
          # therefore must be selected explicitly in this serial daemon lane.
          echo "=== ShieldedWalletRejectRollback ==="
          ctest --test-dir build-tests \
            --output-on-failure \
            --no-tests=error \
            -j1 \
            -R '^ShieldedWalletRejectRollback$'

          # #353 continuation — snapshot-first / mnemonic-later is the exact
          # mobile Full Utreexo Node ordering.  The older #353 gate creates the
          # wallet before snapshot loading and therefore cannot cover it.
          echo "=== AssumeUtxoLateWalletImport ==="
          ctest --test-dir build-tests \
            --output-on-failure \
            --no-tests=error \
            -j1 \
            -R '^AssumeUtxoLateWalletImport$'

      # Daemon logs are printed by the harnesses on failure, so
      # --output-on-failure above captures them. Keep the ctest logs as an
      # artifact too: the harnesses delete their temp datadirs on teardown, so
      # the CI log is the only durable record.
      #
      # #538: harnesses that detect failure by polling must anchor that dump at
      # the action under test (tests/integration/helpers/failure_log_capture.sh),
      # not tail the end of daemon.log. A plain tail shows the poll loop's own
      # output and evicts the evidence — which is precisely when the log is
      # needed, and the CI artifact is the only copy that survives teardown.
      - name: Upload ctest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-linux-full
          path: build-tests/Testing/
          if-no-files-found: ignore
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────
  # QUIC-enabled lane (owner decision, 2026-07-29, follow-up to PR #417):
  # DINERO_ENABLE_QUIC defaults OFF, so the default lane above never even
  # REGISTERS the QUIC test family — the mechanism by which the
  # RelayTlsKeypair bitrot (PR #416) survived CI. This lane configures with
  # QUIC ON, builds the full default graph (which includes every registered
  # QUIC test target), runs the same integrity gate, and runs the QUIC/P2P
  # label selection with --no-tests=error. It is deliberately a SEPARATE
  # job so the default non-QUIC configuration stays covered exactly as
  # before — both configurations are real, so both get CI.
  #
  # Rollout: like this workflow's own v2 soak, not required at first —
  # observe on dinero-main (vendored-OpenSSL QUIC API availability on the
  # runner is the known unknown; tests skip-or-assert per their own
  # policies), document surprises, then promote.
  # ───────────────────────────────────────────────────────────────────────
  linux-quic-full-build-ctest:
    name: Linux x86_64 — QUIC-enabled build + p2p/quic ctest
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            pkg-config \
            python3 \
            perl \
            libcurl4-openssl-dev \
            libudev-dev \
            libusb-1.0-0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.workflow }}-linux-quic
          max-size: 1G

      - name: Cache vendored prerequisites
        uses: actions/cache@v4
        with:
          path: |
            third_party/openssl-3.5.7/prebuilt
            depends/sources
            depends/x86_64-pc-linux-gnu*
            ~/.cargo/registry
            ~/.cargo/git
            third_party/bulletproofs_ffi/target
            third_party/bulletproofs-ffi/target
          key: vendored-tests-quic-${{ runner.os }}-${{ hashFiles('depends/CMakeLists.txt', 'depends/packages/*.cmake', 'scripts/build-openssl-vendored.sh', 'third_party/bulletproofs_ffi/Cargo.lock', 'third_party/bulletproofs-ffi/Cargo.lock') }}
          restore-keys: |
            vendored-tests-quic-${{ runner.os }}-
            vendored-tests-${{ runner.os }}-
            vendored-${{ runner.os }}-

      - name: Build vendored OpenSSL
        run: OPENSSL_VERSION=3.5.7 bash scripts/build-openssl-vendored.sh

      - name: Build depends
        run: |
          cmake -S depends -B depends/build
          cmake --build depends/build -j

      - name: CMake configure (QUIC ON)
        run: |
          cmake -S . -B build-tests-quic \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDINERO_USE_VENDORED_DEPS=ON \
            -DDINERO_ENABLE_QUIC=ON \
            -DENABLE_GRPC=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Full default build (includes registered QUIC test targets)
        run: cmake --build build-tests-quic -j

      # Same gate as the default lane, now over a registry that INCLUDES
      # the QUIC family: registered => built, in this configuration too.
      - name: CTest integrity gate (registered => built)
        run: python3 scripts/ci/check_ctest_integrity.py build-tests-quic

      - name: OpenSSL version assertion (policy pin 3.5.7)
        run: bash scripts/ci/check_openssl_version.sh build-tests-quic 3.5.7

      - name: Report QUIC test inventory
        run: ctest --test-dir build-tests-quic -N -L 'quic|p2p'

      - name: Run QUIC/P2P ctest
        run: |
          # Same pre-existing-debt exclusions as the default lane; the
          # selection is the QUIC/P2P surface this lane exists to cover.
          # --no-tests=error: if the QUIC family ever vanishes from the
          # registry again, this lane fails instead of passing emptily.
          ctest --test-dir build-tests-quic \
            --output-on-failure \
            --no-tests=error \
            -L 'quic|p2p' \
            --label-exclude 'integration|gate|release|canonicality|fuzz'
