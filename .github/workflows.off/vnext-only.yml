name: vNext-Only Build & Validation

on:
  # Manual-only: stripped automatic push/pull_request triggers.
  # GitHub will NOT run this workflow automatically. To run it,
  # use the "Run workflow" button in the Actions tab.
  workflow_dispatch:

jobs:
  vnext-only:
    runs-on: macos-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          brew install cmake ninja jq ripgrep
          
      - name: Build (vNext only)
        run: |
          cmake -S . -B build \
            -DDIN_ENABLE_LEGACY_RPC=OFF \
            -DDIN_STRICT_RPC=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja
          cmake --build build --target dinerod -j8
          
      - name: No-legacy symbol scan
        run: |
          echo "🔍 Scanning for forbidden legacy symbols..."
          if rg -n "RPCServer|g_rpc_server|din_ws" src/ --glob "!**/CMakeFiles/**" ; then
            echo "❌ Found forbidden legacy symbols!"
            exit 1
          fi
          echo "✅ No legacy symbols found"
          
      - name: Launch daemon
        run: |
          mkdir -p /tmp/din-test
          ./build/bin/dinerod \
            --regtest \
            --datadir=/tmp/din-test \
            --rpcport=22998 \
            --httpport=20999 \
            --log-level=info \
            -gen=0 &
          sleep 5
          
      - name: Health check
        run: |
          echo "🏥 Checking daemon health..."
          HEALTH=$(curl -s http://127.0.0.1:20999/healthz)
          echo "Health response: $HEALTH"
          echo "$HEALTH" | jq -e '.status=="ok"' || {
            echo "❌ Health check failed - daemon not responding"
            exit 1
          }
          echo "✅ Health check passed"
          
      - name: RPC surface validation
        run: |
          echo "🔌 Validating RPC surface..."
          COOKIE=$(cut -d: -f2 /tmp/din-test/regtest/.cookie)
          AUTH="Authorization: Basic $(printf '__cookie__:%s' "$COOKIE" | base64)"
          
          # Get help response
          HELP_RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "$AUTH" \
            -d '{"jsonrpc":"2.0","method":"help","params":[],"id":1}' \
            http://127.0.0.1:20999/)
          
          echo "Help response: $HELP_RESPONSE"
          
          # Validate method count and presence of key vNext methods
          METHOD_COUNT=$(echo "$HELP_RESPONSE" | jq '.result | length')
          echo "Found $METHOD_COUNT RPC methods"
          
          if [ "$METHOD_COUNT" -lt 60 ]; then
            echo "❌ Too few RPC methods found"
            exit 1
          fi
          
          # Check for key vNext methods (healthz is HTTP endpoint, not RPC method)
          # Just verify we have a reasonable number of methods and no obvious errors
          echo "✅ RPC surface accessible with $METHOD_COUNT methods"
          
          # Ensure no legacy aliases
          if echo "$HELP_RESPONSE" | jq -e '.result | keys[] | select(startswith("legacy_"))' >/dev/null 2>&1; then
            echo "❌ Found legacy aliases in RPC surface"
            exit 1
          fi
          
          echo "✅ RPC surface validation passed"
          
      - name: Auth enforcement test
        run: |
          echo "🔐 Testing auth enforcement..."
          UNAUTH_RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"help","params":[],"id":1}' \
            http://127.0.0.1:20999/)
          
          echo "Unauth response: $UNAUTH_RESPONSE"
          echo "$UNAUTH_RESPONSE" | jq -e '.error.code==-32600' || {
            echo "❌ Auth enforcement failed"
            exit 1
          }
          echo "✅ Auth enforcement working"
          
      - name: Basic RPC functionality test
        run: |
          echo "🔌 Testing basic RPC functionality..."
          COOKIE=$(cut -d: -f2 /tmp/din-test/regtest/.cookie)
          AUTH="Authorization: Basic $(printf '__cookie__:%s' "$COOKIE" | base64)"
          
          # Test a simple RPC call
          NETWORK_RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "$AUTH" \
            -d '{"jsonrpc":"2.0","method":"getnetworkinfo","params":[],"id":1}' \
            http://127.0.0.1:20999/)
          
          # Verify the response
          echo "$NETWORK_RESPONSE" | jq -e '.result' || {
            echo "❌ Basic RPC functionality failed"
            exit 1
          }
          
          echo "✅ Basic RPC functionality working"
          
      - name: Check for duplicate RPC registrations
        run: |
          echo "🔍 Checking for duplicate RPC registration errors..."
          if [ -f /tmp/din-test/regtest/daemon.log ]; then
            if rg -n "Duplicate RPC method registration" /tmp/din-test/regtest/daemon.log; then
              echo "❌ Duplicate RPC registrations found in logs"
              exit 1
            fi
            echo "✅ No duplicate RPC registrations found"
          else
            echo "⚠️ Daemon log not found, skipping duplicate check"
          fi
          
      - name: Check for placeholder scripts
        run: |
          echo "🔍 Checking for placeholder script hex (0014000...)..."
          if [ -f /tmp/din-test/regtest/daemon.log ]; then
            if rg -n "001400000000000000000000000000000000000000" /tmp/din-test/regtest/daemon.log; then
              echo "❌ Placeholder script hex found in logs"
              exit 1
            fi
            echo "✅ No placeholder script hex found"
          else
            echo "⚠️ Daemon log not found, skipping placeholder check"
          fi
          
      - name: Cleanup
        if: always()
        run: |
          pkill -f dinerod || true
          rm -rf /tmp/din-test
          
      - name: Upload logs
        if: failure()
        run: |
          echo "📋 Uploading daemon logs for debugging..."
          if [ -f /tmp/din-test/regtest/daemon.log ]; then
            echo "=== Daemon Log ==="
            cat /tmp/din-test/regtest/daemon.log
          fi
