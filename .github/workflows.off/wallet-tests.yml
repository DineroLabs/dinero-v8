name: Wallet & P0 Tests
on:
  # Manual-only: stripped automatic push/pull_request triggers.
  # GitHub will NOT run this workflow automatically. To run it,
  # use the "Run workflow" button in the Actions tab.
  workflow_dispatch:

jobs:
  wallet-and-p0:
    strategy: 
      matrix: 
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev pkg-config
          
      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install cmake ninja pkg-config
          
      - name: Configure
        run: cmake -S . -B build-test -G "Ninja" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DENABLE_SANITIZERS=ON
        
      - name: Build
        run: cmake --build build-test -j
        
      - name: P0 crypto tests
        run: ctest --test-dir build-test -L p0 --output-on-failure
        env:
          ASAN_OPTIONS: strict_string_checks=1:detect_stack_use_after_return=1:abort_on_error=1:detect_leaks=${{ startsWith(matrix.os,'ubuntu') && '1' || '0' }}
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          
      - name: Wallet durability tests
        run: ctest --test-dir build-test -R "wallet_(sqlite_lifecycle|kill9_durability)" --output-on-failure
        env:
          ASAN_OPTIONS: strict_string_checks=1:detect_stack_use_after_return=1:abort_on_error=1:detect_leaks=${{ startsWith(matrix.os,'ubuntu') && '1' || '0' }}
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          DIN_WAL_STRONG: "1"
          DINERO_WALLET_SYNC: "FULL"
