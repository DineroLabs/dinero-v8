name: Release-Grade Binary Verification

# Phase 4: CI Enforcement for Exchange-Ready Binaries
# Ensures all release builds have ZERO Homebrew dependencies
# Blocks merges if binaries link gRPC/protobuf/abseil

on:
  # Manual-only: stripped automatic push/pull_request triggers.
  # GitHub will NOT run this workflow automatically. To run it,
  # use the "Run workflow" button in the Actions tab.
  workflow_dispatch:

jobs:
  verify-release-binary-macos:
    name: Verify Release Binary (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          # Install only build-time dependencies
          # Runtime dependencies MUST be statically linked
          brew install cmake openssl boost sqlite qt@6

          # Note: We install gRPC for build system, but DINERO_RELEASE=ON
          # will NOT link it into the final binary
          brew install protobuf grpc

      - name: Configure CMake (Release Mode)
        run: |
          mkdir -p build
          cd build
          cmake -DDINERO_RELEASE=ON \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES=arm64 \
                ..

          echo "✅ CMake configured with DINERO_RELEASE=ON"
          echo "   - gRPC/protobuf/abseil: DISABLED"
          echo "   - Lightning IPC: Raw sockets"
          echo "   - Target: Exchange-ready binaries"

      - name: Build dinerod (release mode)
        run: |
          cd build
          make dinerod -j$(sysctl -n hw.ncpu)

          echo "✅ dinerod built successfully"
          ls -lh dinerod

      - name: Build lightningd (release mode)
        run: |
          cd build
          make lightningd -j$(sysctl -n hw.ncpu) || echo "⚠️  lightningd build optional"

          if [ -f "lightningd" ]; then
            echo "✅ lightningd built successfully"
            ls -lh lightningd
          else
            echo "ℹ️  lightningd not built (optional for verification)"
          fi

      - name: Verify dinerod is release-grade
        run: |
          chmod +x scripts/verify_release_binary.sh
          ./scripts/verify_release_binary.sh build/dinerod

          echo ""
          echo "════════════════════════════════════════════════════════════════"
          echo "✅ VERIFICATION PASSED: dinerod is exchange-ready"
          echo "════════════════════════════════════════════════════════════════"

      - name: Verify lightningd is release-grade (if built)
        run: |
          if [ -f "build/lightningd" ]; then
            ./scripts/verify_release_binary.sh build/lightningd

            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "✅ VERIFICATION PASSED: lightningd is exchange-ready"
            echo "════════════════════════════════════════════════════════════"
          else
            echo "ℹ️  Skipping lightningd verification (not built)"
          fi

      - name: Check binary dependencies
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "dinerod dynamic dependencies:"
          echo "═══════════════════════════════════════════════════════════════"
          otool -L build/dinerod

          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "Dependency count:"
          echo "═══════════════════════════════════════════════════════════════"
          DEPS=$(otool -L build/dinerod | tail -n +2 | wc -l | tr -d ' ')
          echo "Total dependencies: $DEPS"

          # Bitcoin Core has ~2-3 dependencies (libSystem, libc++, maybe pthread)
          # We should have similar or fewer
          if [ "$DEPS" -gt 5 ]; then
            echo "⚠️  WARNING: More than 5 dependencies detected"
            echo "   Expected: 2-3 (system libraries only)"
          else
            echo "✅ Dependency count looks good (≤5)"
          fi

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: dinero-macos-arm64-release
          path: |
            build/dinerod
            build/lightningd
          retention-days: 30

  verify-release-binary-linux:
    name: Verify Release Binary (Linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libssl-dev \
            libboost-all-dev \
            libsqlite3-dev \
            libprotobuf-dev \
            protobuf-compiler \
            libgrpc++-dev \
            protobuf-compiler-grpc

      - name: Configure CMake (Release Mode)
        run: |
          mkdir -p build
          cd build
          cmake -DDINERO_RELEASE=ON \
                -DCMAKE_BUILD_TYPE=Release \
                ..

          echo "✅ CMake configured with DINERO_RELEASE=ON"

      - name: Build dinerod (release mode)
        run: |
          cd build
          make dinerod -j$(nproc)

          echo "✅ dinerod built successfully"
          ls -lh dinerod

      - name: Build lightningd (release mode)
        run: |
          cd build
          make lightningd -j$(nproc) || echo "⚠️  lightningd build optional"

          if [ -f "lightningd" ]; then
            echo "✅ lightningd built successfully"
            ls -lh lightningd
          fi

      - name: Verify dinerod is release-grade
        run: |
          chmod +x scripts/verify_release_binary.sh
          ./scripts/verify_release_binary.sh build/dinerod

          echo ""
          echo "════════════════════════════════════════════════════════════════"
          echo "✅ VERIFICATION PASSED: dinerod is exchange-ready"
          echo "════════════════════════════════════════════════════════════════"

      - name: Verify lightningd is release-grade (if built)
        run: |
          if [ -f "build/lightningd" ]; then
            ./scripts/verify_release_binary.sh build/lightningd

            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "✅ VERIFICATION PASSED: lightningd is exchange-ready"
            echo "════════════════════════════════════════════════════════════"
          fi

      - name: Check binary dependencies
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "dinerod dynamic dependencies:"
          echo "═══════════════════════════════════════════════════════════════"
          ldd build/dinerod || true

          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "Checking for problematic dependencies:"
          echo "═══════════════════════════════════════════════════════════════"

          # Check for gRPC
          if ldd build/dinerod | grep -i grpc; then
            echo "❌ FAIL: Found gRPC dependency"
            exit 1
          else
            echo "✅ No gRPC dependencies"
          fi

          # Check for protobuf
          if ldd build/dinerod | grep -i protobuf; then
            echo "❌ FAIL: Found protobuf dependency"
            exit 1
          else
            echo "✅ No protobuf dependencies"
          fi

          # Check for abseil
          if ldd build/dinerod | grep -i absl; then
            echo "❌ FAIL: Found abseil dependency"
            exit 1
          else
            echo "✅ No abseil dependencies"
          fi

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: dinero-linux-x86_64-release
          path: |
            build/dinerod
            build/lightningd
          retention-days: 30

  release-grade-summary:
    name: Release-Grade Verification Summary
    needs: [verify-release-binary-macos, verify-release-binary-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Summary
        run: |
          echo "════════════════════════════════════════════════════════════════"
          echo "✅ ALL RELEASE-GRADE VERIFICATIONS PASSED"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          echo "Verified platforms:"
          echo "  ✅ macOS (arm64)"
          echo "  ✅ Linux (x86_64)"
          echo ""
          echo "Verification criteria:"
          echo "  ✅ No Homebrew dependencies"
          echo "  ✅ No gRPC/protobuf/abseil runtime linkage"
          echo "  ✅ Only system libraries linked"
          echo "  ✅ Exchange-ready binaries"
          echo ""
          echo "Architecture:"
          echo "  • Dev builds: gRPC + protobuf (fast iteration)"
          echo "  • Release builds: Raw sockets (zero dependencies)"
          echo ""
          echo "Build mode: DINERO_RELEASE=ON"
          echo "IPC transport: Socket (Bitcoin Core style)"
          echo ""
          echo "Binaries are ready for exchange distribution! 🚀"
          echo "════════════════════════════════════════════════════════════════"

      - name: Create status check
        run: |
          echo "status=success" >> $GITHUB_OUTPUT

# Note: This workflow MUST pass before merging to main/master
# GitHub branch protection rules should require this check
