name: build
on:
  # Manual-only: stripped automatic push/pull_request triggers.
  # GitHub will NOT run this workflow automatically. To run it,
  # use the "Run workflow" button in the Actions tab.
  workflow_dispatch:
jobs:
  cmake:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libssl-dev libsqlite3-dev libsecp256k1-dev
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja openssl sqlite secp256k1 jsoncpp
      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake ninja openssl sqlite
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target dinerod -j 4
      - name: Run Genesis Invariant Tests (CRITICAL)
        run: |
          cd build
          ctest -R GenesisInvariants --output-on-failure
        shell: bash
      - name: Test Help
        run: ./build/dinerod -help || ./build/dinerod.exe -help
        shell: bash