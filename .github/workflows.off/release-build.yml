name: Multi-Platform Release Build

on:
  # Manual-only: stripped automatic push/pull_request triggers.
  # GitHub will NOT run this workflow automatically. To run it,
  # use the "Run workflow" button in the Actions tab.
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            script: ./scripts/build-release-node.sh
          - os: macos-14
            platform: macos
            script: ./scripts/build-release-node.sh
          - os: windows-2022
            platform: windows
            script: pwsh scripts/build-release-node.ps1

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set release version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_VERSION=${{ github.event.inputs.release_tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libssl-dev \
            libboost-all-dev \
            libsqlite3-dev \
            libcurl4-openssl-dev \
            qt6-base-dev \
            qt6-tools-dev \
            libqt6svg6-dev \
            libprotobuf-dev \
            protobuf-compiler \
            libgrpc++-dev \
            protobuf-compiler-grpc

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake openssl boost sqlite qt@6 protobuf grpc

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          choco install ninja -y

      - name: Build binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/build-release-node.sh
          ${{ matrix.script }}

      - name: Build binaries (Windows)
        if: runner.os == 'Windows'
        run: ${{ matrix.script }}

      - name: List build outputs
        shell: bash
        run: |
          echo "Build outputs:"
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dinero-${{ matrix.platform }}-${{ env.RELEASE_VERSION }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/BUILD_ATTESTATION.json
            dist/SHA256SUMS*
          retention-days: 90

      - name: Upload to release (if tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/BUILD_ATTESTATION.json
            dist/SHA256SUMS*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-manifest:
    name: Create Release Manifest
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release manifest
        run: |
          echo "# DineroCoin ${GITHUB_REF#refs/tags/} — Multi-Platform Release" > RELEASE_MANIFEST.md
          echo "" >> RELEASE_MANIFEST.md
          echo "**Release:** ${GITHUB_REF#refs/tags/}" >> RELEASE_MANIFEST.md
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> RELEASE_MANIFEST.md
          echo "**Commit:** $GITHUB_SHA" >> RELEASE_MANIFEST.md
          echo "**Build:** GitHub Actions (Native Builders)" >> RELEASE_MANIFEST.md
          echo "" >> RELEASE_MANIFEST.md
          echo "## Build Information" >> RELEASE_MANIFEST.md
          echo "" >> RELEASE_MANIFEST.md
          echo "| Platform | Runner | Archive | SHA256 |" >> RELEASE_MANIFEST.md
          echo "|----------|--------|---------|--------|" >> RELEASE_MANIFEST.md

          for dir in artifacts/*/; do
            for file in "$dir"*.{tar.gz,zip} 2>/dev/null; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                platform=$(echo "$dir" | cut -d'-' -f2)
                sha256file="${file}.sha256"
                if [ -f "$sha256file" ]; then
                  sha256=$(cat "$sha256file" | cut -d' ' -f1)
                else
                  sha256="N/A"
                fi
                runner="N/A"
                if [[ "$platform" == *"linux"* ]]; then runner="ubuntu-22.04"; fi
                if [[ "$platform" == *"macos"* ]]; then runner="macos-14"; fi
                if [[ "$platform" == *"windows"* ]]; then runner="windows-2022"; fi
                echo "| $platform | $runner | $filename | \`$sha256\` |" >> RELEASE_MANIFEST.md
              fi
            done
          done

          echo "" >> RELEASE_MANIFEST.md
          echo "## Verification" >> RELEASE_MANIFEST.md
          echo "" >> RELEASE_MANIFEST.md
          echo "Each binary includes a SHA256 checksum file. Verify integrity:" >> RELEASE_MANIFEST.md
          echo "" >> RELEASE_MANIFEST.md
          echo "\`\`\`bash" >> RELEASE_MANIFEST.md
          echo "# Linux/macOS" >> RELEASE_MANIFEST.md
          echo "shasum -a 256 -c DineroCoin-*.tar.gz.sha256" >> RELEASE_MANIFEST.md
          echo "" >> RELEASE_MANIFEST.md
          echo "# Windows (PowerShell)" >> RELEASE_MANIFEST.md
          echo "(Get-FileHash DineroCoin-*.zip).Hash -eq (Get-Content DineroCoin-*.zip.sha256).Split()[0]" >> RELEASE_MANIFEST.md
          echo "\`\`\`" >> RELEASE_MANIFEST.md
          echo "" >> RELEASE_MANIFEST.md
          echo "## Protocol Verification" >> RELEASE_MANIFEST.md
          echo "" >> RELEASE_MANIFEST.md
          echo "Verify the protocol core (Rings 1-8):" >> RELEASE_MANIFEST.md
          echo "" >> RELEASE_MANIFEST.md
          echo "\`\`\`bash" >> RELEASE_MANIFEST.md
          echo "git clone https://github.com/Trucker2827/Dinero-Coin.git" >> RELEASE_MANIFEST.md
          echo "cd Dinero-Coin" >> RELEASE_MANIFEST.md
          echo "git checkout ${GITHUB_REF#refs/tags/}" >> RELEASE_MANIFEST.md
          echo "cmake -S . -B build && cmake --build build" >> RELEASE_MANIFEST.md
          echo "ctest --test-dir build -R \"Ring\" --output-on-failure" >> RELEASE_MANIFEST.md
          echo "\`\`\`" >> RELEASE_MANIFEST.md
          echo "" >> RELEASE_MANIFEST.md
          echo "**Expected:** 65/65 Ring tests passed (100%)" >> RELEASE_MANIFEST.md

          cat RELEASE_MANIFEST.md

      - name: Upload manifest to release
        uses: softprops/action-gh-release@v1
        with:
          files: RELEASE_MANIFEST.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
