name: v3.0.0-alpha Release Build

on:
  # Manual-only: stripped automatic push/pull_request triggers.
  # GitHub will NOT run this workflow automatically. To run it,
  # use the "Run workflow" button in the Actions tab.
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (Apple Silicon)
          - os: macos-14
            platform: macos
            arch: arm64
            cmake_flags: >-
              -DDINERO_RELEASE=ON
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_OSX_ARCHITECTURES=arm64
              -DENABLE_TESTS=ON
              -DENABLE_GPU_MINING=OFF

          # macOS (Intel)
          - os: macos-13
            platform: macos
            arch: x86_64
            cmake_flags: >-
              -DDINERO_RELEASE=ON
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_OSX_ARCHITECTURES=x86_64
              -DENABLE_TESTS=ON
              -DENABLE_GPU_MINING=OFF

          # Linux (x86_64)
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            cmake_flags: >-
              -DDINERO_RELEASE=ON
              -DCMAKE_BUILD_TYPE=Release
              -DENABLE_TESTS=ON
              -DENABLE_GPU_MINING=ON

          # Windows (x86_64)
          - os: windows-2022
            platform: windows
            arch: x86_64
            cmake_flags: >-
              -DDINERO_RELEASE=ON
              -DCMAKE_BUILD_TYPE=Release
              -DENABLE_TESTS=ON
              -DENABLE_GPU_MINING=OFF

    steps:
      # ══════════════════════════════════════════════════════════
      # Stage 1: Environment Setup
      # ══════════════════════════════════════════════════════════

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake openssl boost sqlite qt@6

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libssl-dev \
            libboost-all-dev \
            libsqlite3-dev \
            libcurl4-openssl-dev \
            qt6-base-dev \
            qt6-tools-dev \
            ninja-build

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake ninja visualstudio2022buildtools -y

      # ══════════════════════════════════════════════════════════
      # Stage 2: Checkout & Submodules
      # ══════════════════════════════════════════════════════════

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ══════════════════════════════════════════════════════════
      # Stage 3: CMake Configuration
      # ══════════════════════════════════════════════════════════

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          cmake -S . -B build ${{ matrix.cmake_flags }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:SOURCE_DATE_EPOCH = git log -1 --format=%ct
          cmake -S . -B build ${{ matrix.cmake_flags }}

      # ══════════════════════════════════════════════════════════
      # Stage 4: Build Binaries
      # ══════════════════════════════════════════════════════════

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake --build build --config Release --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      # ══════════════════════════════════════════════════════════
      # Stage 5: Run Tests
      # ══════════════════════════════════════════════════════════

      - name: Run Ring tests
        run: ctest --test-dir build -R "Ring" --output-on-failure
        continue-on-error: false

      - name: Run consensus tests
        run: ctest --test-dir build -R "consensus" --output-on-failure
        continue-on-error: false

      - name: Run mobile tests
        run: ctest --test-dir build -R "mobile" --output-on-failure
        continue-on-error: true

      - name: Run Lightning tests
        run: ctest --test-dir build -R "lightning" --output-on-failure
        continue-on-error: true

      # ══════════════════════════════════════════════════════════
      # Stage 6: Smoke Tests
      # ══════════════════════════════════════════════════════════

      - name: Run smoke tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/smoke-test.sh
          export DINEROD=./build/dinerod
          export DINERO_CLI=./build/dinero-cli
          ./scripts/smoke-test.sh

      - name: Run smoke tests (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:DINEROD = ".\build\Release\dinerod.exe"
          $env:DINERO_CLI = ".\build\Release\dinero-cli.exe"
          if (Test-Path scripts/smoke-test.sh) {
            bash scripts/smoke-test.sh
          } else {
            Write-Host "Smoke test script not found, skipping"
          }

      # ══════════════════════════════════════════════════════════
      # Stage 7: Binary Verification
      # ══════════════════════════════════════════════════════════

      - name: Verify binary (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "Checking binary architecture..."
          file build/dinerod

          echo "Checking for Homebrew dependencies..."
          otool -L build/dinerod | tee deps.txt
          if otool -L build/dinerod | grep -q '/opt/homebrew'; then
            echo "ERROR: Homebrew dependencies found!"
            exit 1
          fi
          echo "✅ No Homebrew dependencies"

      - name: Verify binary (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "Checking binary format..."
          file build/dinerod

          echo "Checking for unwanted dependencies..."
          ldd build/dinerod | tee deps.txt
          if ldd build/dinerod | grep -iq 'grpc\|protobuf\|absl'; then
            echo "ERROR: Unwanted dependencies found!"
            exit 1
          fi
          echo "✅ No unwanted dependencies"

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Checking binary format..."
          if (Test-Path "build\Release\dinerod.exe") {
            Get-Item "build\Release\dinerod.exe" | Format-List
            Write-Host "✅ Binary exists"
          } else {
            Write-Host "ERROR: Binary not found!"
            exit 1
          }

      # ══════════════════════════════════════════════════════════
      # Stage 8: Package Artifacts
      # ══════════════════════════════════════════════════════════

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION=${{ github.ref_name || inputs.version }}
          mkdir -p dist
          ARCHIVE_NAME="DineroCoin-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"

          mkdir -p "${ARCHIVE_NAME}/bin"
          cp build/dinerod "${ARCHIVE_NAME}/bin/"
          cp build/dinero-cli "${ARCHIVE_NAME}/bin/" || true
          cp README.md "${ARCHIVE_NAME}/" || true
          cp CHANGELOG.md "${ARCHIVE_NAME}/" || true
          cp SECURITY.md "${ARCHIVE_NAME}/" || true

          tar -czf "dist/${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          shasum -a 256 "dist/${ARCHIVE_NAME}.tar.gz" > "dist/${ARCHIVE_NAME}.tar.gz.sha256"

          echo "✅ Created dist/${ARCHIVE_NAME}.tar.gz"

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $VERSION = "${{ github.ref_name }}"
          if (-not $VERSION) { $VERSION = "${{ inputs.version }}" }
          New-Item -ItemType Directory -Force -Path dist
          $ARCHIVE_NAME = "DineroCoin-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"

          New-Item -ItemType Directory -Force -Path "${ARCHIVE_NAME}\bin"
          Copy-Item "build\Release\dinerod.exe" "${ARCHIVE_NAME}\bin\" -ErrorAction SilentlyContinue
          Copy-Item "build\Release\dinero-cli.exe" "${ARCHIVE_NAME}\bin\" -ErrorAction SilentlyContinue
          Copy-Item "README.md" "${ARCHIVE_NAME}\" -ErrorAction SilentlyContinue
          Copy-Item "CHANGELOG.md" "${ARCHIVE_NAME}\" -ErrorAction SilentlyContinue
          Copy-Item "SECURITY.md" "${ARCHIVE_NAME}\" -ErrorAction SilentlyContinue

          Compress-Archive -Path "${ARCHIVE_NAME}" -DestinationPath "dist\${ARCHIVE_NAME}.zip"
          (Get-FileHash "dist\${ARCHIVE_NAME}.zip" -Algorithm SHA256).Hash | Out-File "dist\${ARCHIVE_NAME}.zip.sha256" -Encoding ascii

          Write-Host "✅ Created dist/${ARCHIVE_NAME}.zip"

      # ══════════════════════════════════════════════════════════
      # Stage 9: Upload Artifacts
      # ══════════════════════════════════════════════════════════

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dinero-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.ref_name || inputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          retention-days: 90

  # ════════════════════════════════════════════════════════════
  # Release Job (runs after all builds complete)
  # ════════════════════════════════════════════════════════════

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release/ \;

          # Generate combined SHA256SUMS
          cd release
          shasum -a 256 *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: false
          prerelease: true
          body: |
            # DineroCoin ${{ github.ref_name }}

            ## ⚠️ ALPHA RELEASE
            **This is a pre-release version for testing only.**
            - ❌ NOT for production use
            - ❌ NOT externally audited
            - ✅ Testnet use only
            - ✅ Feedback welcome!

            ## What's New in v3.0
            - 🎯 **Stateless Validation** - Full nodes without UTXO database (Utreexo)
            - 🌐 **Proof Network** - Efficient proof distribution (cache, routing, gossip, compression)
            - ⚡ **Lightning Integration** - Stateless watchtower, proof-based channel validation
            - 📱 **Mobile Profile** - Compiler-enforced resource limits for iOS/Android
            - 🔄 **Sync Validation** - Resumable sync, cache eviction handling

            ## Downloads
            See assets below for platform-specific binaries.

            ## Verification
            ```bash
            # macOS/Linux
            shasum -a 256 -c DineroCoin-*.tar.gz.sha256

            # Windows (PowerShell)
            (Get-FileHash DineroCoin-*.zip).Hash -eq (Get-Content DineroCoin-*.zip.sha256)
            ```

            ## Security Notice
            ⚠️ This release has NOT been externally audited. Use at your own risk.

            For production use, please use [v2.2.6](https://github.com/Trucker2827/Dinero-Coin/releases/tag/v2.2.6).

            ## Support
            - **Issues:** https://github.com/Trucker2827/Dinero-Coin/issues
            - **Security:** security@dinero-coin.com
            - **Documentation:** https://github.com/Trucker2827/Dinero-Coin/tree/main/docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
