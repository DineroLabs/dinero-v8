name: Logger DI Guard

on:
  # Manual-only: stripped automatic push/pull_request triggers.
  # GitHub will NOT run this workflow automatically. To run it,
  # use the "Run workflow" button in the Actions tab.
  workflow_dispatch:

jobs:
  check-logger-di:
    name: Prevent Global Logger Regressions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check for g_logger usage
        run: |
          echo "🔍 Scanning for global logger usage..."

          # Search for g_logger usage in source files
          # Exclude:
          # - vendor/ third-party code
          # - test/ legacy test files (TODO: migrate these)
          # - logger.cpp/logger.h (definition files)
          # - Comments and documentation

          VIOLATIONS=$(grep -r "g_logger\." src/ include/ \
            --include="*.cpp" \
            --include="*.h" \
            --exclude-dir=vendor \
            --exclude-dir=third_party \
            --exclude=logger.cpp \
            --exclude=logger.h \
            | grep -v "^\s*//" \
            | grep -v "^\s*\*" \
            | grep -v "TODO" \
            | grep -v "FIXME" || true)

          if [ -n "$VIOLATIONS" ]; then
            echo "❌ ERROR: Global logger usage detected!"
            echo ""
            echo "The following files contain g_logger usage:"
            echo "$VIOLATIONS"
            echo ""
            echo "🔧 Fix: Use dependency injection instead:"
            echo "  1. Add 'ILogger* m_logger = nullptr;' to class"
            echo "  2. Add 'void setLogger(ILogger* logger)' method"
            echo "  3. Define service-specific macros (e.g., SVCLOG_INFO)"
            echo "  4. Replace 'g_logger.info()' with 'SVCLOG_INFO()'"
            echo ""
            echo "📚 See: LOGGER_DEPENDENCY_INJECTION_COMPLETION.md"
            exit 1
          fi

          echo "✅ No global logger usage found!"
          echo "✅ All services properly use dependency injection"

      - name: Verify DI pattern compliance
        run: |
          echo "🔍 Verifying DI pattern compliance..."

          # Check that new services have proper DI setup
          # Look for setLogger methods
          SERVICES_WITH_DI=$(grep -r "void setLogger(ILogger\* logger)" include/ --include="*.h" | wc -l)

          echo "✅ Found $SERVICES_WITH_DI services with logger DI"

          if [ "$SERVICES_WITH_DI" -lt 3 ]; then
            echo "⚠️  Warning: Expected at least 3 services with DI (Mempool, P2P, Mining)"
            exit 1
          fi

          echo "✅ DI pattern compliance verified"

      - name: Check for proper ILogger forward declarations
        run: |
          echo "🔍 Checking for proper ILogger forward declarations..."

          # Verify that headers use forward declarations
          HEADERS_WITH_ILOGGER=$(grep -l "class ILogger;" include/ -r --include="*.h" | wc -l)

          echo "✅ Found $HEADERS_WITH_ILOGGER headers with ILogger forward declarations"

          if [ "$HEADERS_WITH_ILOGGER" -lt 3 ]; then
            echo "⚠️  Warning: Expected at least 3 headers with forward declarations"
            exit 1
          fi

          echo "✅ Forward declaration pattern verified"

      - name: Report success
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Logger DI Guard: PASSED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "✅ No global logger regressions detected"
          echo "✅ DI pattern compliance verified"
          echo "✅ Forward declarations present"
          echo ""
          echo "📊 Architecture Status:"
          echo "   - Mempool: DI ✅"
          echo "   - SimpleP2P: DI ✅"
          echo "   - P2POfferRegistry: DI ✅"
          echo "   - Mining: DI ✅"
          echo ""
          echo "📚 Documentation: LOGGER_DEPENDENCY_INJECTION_COMPLETION.md"
