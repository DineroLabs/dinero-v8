name: Hardening CI - PSBT & Mining Guards

on:
  # Manual-only: stripped automatic push/pull_request triggers.
  # GitHub will NOT run this workflow automatically. To run it,
  # use the "Run workflow" button in the Actions tab.
  workflow_dispatch:

jobs:
  hardening-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        type: [release, asan-ubsan]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lld jq sqlite3
          # Install Google Test
          sudo apt-get install -y libgtest-dev
      
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja jq sqlite3 googletest
      
      - name: Configure build
        run: |
          cmake -S . -B build -G Ninja \
            -DDIN_ENABLE_LEGACY_RPC=OFF \
            -DDIN_ENABLE_WS=OFF \
            -DCMAKE_BUILD_TYPE=${{ matrix.type == 'release' && 'Release' || 'RelWithDebInfo' }} \
            ${{ matrix.type == 'asan-ubsan' && '-DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"' || '' }}
      
      - name: Build daemon and tests
        run: |
          cmake --build build -j8 --target dinerod
          cmake --build build -j8 --target test_mining_address
      
      - name: Run unit tests
        run: |
          ./build/tests/test_mining_address
      
      - name: PSA Integration Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:allocator_may_return_null=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          # Clean any previous test data
          pkill -f dinerod || true
          rm -rf /tmp/dinero-*
          
          # Run the PSA integration test
          ./tests/test_psa_integration.sh
      
      - name: DB Invariants Check
        run: |
          # Run database invariants check on the test database
          DB_PATH="/tmp/dinero-psa-test-$$/regtest/blockchain.db"
          if [[ -f "$DB_PATH" ]]; then
            echo "Running DB invariants check..."
            sqlite3 "$DB_PATH" < tests/db_invariants.sql
          else
            echo "Test database not found, skipping invariants check"
          fi
      
      - name: Placeholder Guard Check
        run: |
          # Run placeholder guard on the test database
          DB_PATH="/tmp/dinero-psa-test-$$/regtest/blockchain.db"
          if [[ -f "$DB_PATH" ]]; then
            ./tests/ci_placeholder_guard.sh "$DB_PATH"
          else
            echo "Test database not found, skipping placeholder check"
          fi
      
      - name: Quick Verification Tests
        run: |
          # Additional quick checks to ensure system integrity
          echo "🔍 Running quick verification tests..."
          
          # Start a fresh daemon for verification
          pkill -f dinerod || true
          rm -rf /tmp/dinero-verify
          
          ./build/bin/dinerod --regtest --datadir=/tmp/dinero-verify \
            --rpcport=22998 --httpport=20999 --log-level=info -gen=0 > verify.log 2>&1 &
          DAEMON_PID=$!
          sleep 3
          
          # Source RPC helper
          source rpc.sh || echo 'RPC() { curl -s -X POST -H "Content-Type: application/json" -H "Authorization: Basic $(cat /tmp/dinero-verify/regtest/.cookie | base64)" -d "{\"method\":\"$1\",\"params\":$2,\"id\":1}" "http://127.0.0.1:20999/"; }'
          
          # Initialize wallet
          RPC "wallet.create" '["default", "test_seed"]' | jq -e '.result.created == true'
          RPC "wallet.load" '["default"]' | jq -e '.result.active == true'
          
          # Mine a few blocks
          ADDR=$(RPC "getnewaddress" "[]" | jq -r '.result')
          RPC "mining.generatetoaddress" "[5, \"$ADDR\"]" >/dev/null
          
          # Verify no placeholders in new UTXOs
          PLACEHOLDER_COUNT=$(sqlite3 /tmp/dinero-verify/regtest/blockchain.db \
            "SELECT COUNT(*) FROM utxo WHERE hex(script_pubkey) = '00140000000000000000000000000000000000000000';")
          
          if [[ "$PLACEHOLDER_COUNT" != "0" ]]; then
            echo "❌ Found $PLACEHOLDER_COUNT placeholder UTXOs in verification test"
            exit 1
          fi
          
          echo "✅ Verification test passed - no placeholders found"
          
          # Cleanup
          kill $DAEMON_PID 2>/dev/null || true
          wait $DAEMON_PID 2>/dev/null || true
      
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.type }}
          path: |
            daemon.log
            verify.log
            /tmp/dinero-*/regtest/blockchain.db
          retention-days: 7
      
      - name: Cleanup
        if: always()
        run: |
          pkill -f dinerod || true
          rm -rf /tmp/dinero-*

  # Summary job that requires all matrix jobs to pass
  hardening-summary:
    needs: hardening-tests
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Check hardening test results
        run: |
          if [[ "${{ needs.hardening-tests.result }}" != "success" ]]; then
            echo "❌ Hardening tests failed"
            exit 1
          fi
          echo "✅ All hardening tests passed"
      
      - name: Report success
        run: |
          echo "🎉 Hardening CI completed successfully!"
          echo "✅ Unit tests passed"
          echo "✅ PSA integration tests passed"
          echo "✅ DB invariants validated"
          echo "✅ No placeholder scripts found"
          echo "✅ Quick verification tests passed"
