name: Fakery Sweep

on:
  # Manual-only: stripped automatic push/pull_request triggers.
  # GitHub will NOT run this workflow automatically. To run it,
  # use the "Run workflow" button in the Actions tab.
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Sweep for TODOs/stubs
        run: |
          bash scripts/sweep_fakery.sh . --fail-on critical --format md | tee sweep_report.md
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: fakery-report
          path: sweep_report.md
