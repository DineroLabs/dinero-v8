name: Build Windows Binaries

on:
  # Manual-only: stripped automatic push/pull_request triggers.
  # GitHub will NOT run this workflow automatically. To run it,
  # use the "Run workflow" button in the Actions tab.
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
    
    - name: Install CMake
      uses: lukka/get-cmake@latest
    
    - name: Install vcpkg dependencies
      run: |
        vcpkg install openssl:x64-windows-static
        vcpkg install rocksdb:x64-windows-static
        vcpkg integrate install
    
    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtcharts qtnetworkauth'
        cache: true
    
    - name: Configure CMake (Daemon + Miner)
      run: |
        cmake -B build-cli `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_GUI=OFF `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
    
    - name: Build Daemon and Miner
      run: cmake --build build-cli --config Release --target dinerod dinero-miner -j 4
    
    - name: Configure CMake (GUI)
      run: |
        cmake -B build-gui `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_GUI=ON `
          -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
    
    - name: Build GUI
      run: cmake --build build-gui --config Release --target dinero-qt -j 4
    
    - name: Package binaries
      run: |
        mkdir dist
        copy build-cli\Release\dinerod.exe dist\
        copy build-cli\Release\dinero-miner.exe dist\
        copy build-gui\gui\Release\dinero-qt.exe dist\
        windeployqt dist\dinero-qt.exe --release --no-translations
    
    - name: Create ZIP archive
      run: |
        cd dist
        7z a ../dinero-windows-x64.zip *
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dinero-windows-x64
        path: dinero-windows-x64.zip
    
    - name: Create Release (on tags)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: dinero-windows-x64.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
