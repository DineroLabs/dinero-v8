name: smoke
on:
  # Manual-only: stripped automatic push/pull_request triggers.
  # GitHub will NOT run this workflow automatically. To run it,
  # use the "Run workflow" button in the Actions tab.
  workflow_dispatch:
jobs:
  regtest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsqlite3-dev jq curl lsof
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target dinerod -j2
      - name: Smoke test (unified/separate ports)
        run: |
          chmod +x ./regression_smoke_test.sh
          # unified default
          KEEP_ALIVE=0 ./regression_smoke_test.sh regtest-smoke
          # separate ports (override)
          RPC=21999 P2P=41999 KEEP_ALIVE=0 ./regression_smoke_test.sh regtest-smoke-ports
