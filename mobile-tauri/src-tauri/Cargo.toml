[package]
name = "dinero-mobile"
version = "0.1.0"
description = "Dinero Mobile Wallet - Tauri + Rust"
authors = ["Dinero Team"]
license = "MIT"
repository = "https://github.com/dinero/dinero"
edition = "2021"

[lib]
name = "dinero_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-camera = "2"
tauri-plugin-biometric = "2"
tauri-plugin-notification = "2"
tauri-plugin-secure-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
hex = "0.4"
sha2 = "0.10"
aes-gcm = "0.10"
pbkdf2 = "0.12"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# FFI bindings (will link to libdinero_wallet.a)
[build-dependencies]
cc = "1"

