# Dinero Node Configuration - Linux Server Optimized
# Optimized for 1GB RAM, 1 CPU Core, 15GB Storage

# Network Settings
listen=1
upnp=0
port=23999
bind=0.0.0.0

# RPC Settings
server=1
rpcbind=0.0.0.0
rpcport=20998
rpcallowip=0.0.0.0/0

# WebSocket Settings (for real-time updates)
wsport=22999
wsbind=0.0.0.0

# Logging (reduced for limited storage)
printtoconsole=0
debuglogfile=logs/daemon.log
shrinkdebugfile=1

# Performance Optimization for 1GB RAM
dbcache=128
maxmempool=50
maxconnections=32
maxuploadtarget=500

# Mining (disabled by default - enable if needed)
gen=0
genproclimit=1

# Seed Nodes (for network connectivity)
addnode=seed1.dinero-coin.com:23999
addnode=seed2.dinero-coin.com:23999
addnode=seed3.dinero-coin.com:23999
addnode=backup1.dinero-coin.com:23999

# Storage optimization
prune=2000
