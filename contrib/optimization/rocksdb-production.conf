# Dinero RocksDB Production Configuration
# Optimized settings for production seed nodes and mining nodes

# Memory Configuration (adjust based on available RAM)
# For 8GB RAM system:
block_cache_size=2G
write_buffer_size=128M
max_write_buffer_number=4
db_write_buffer_size=512M

# For 16GB RAM system:
# block_cache_size=4G
# write_buffer_size=256M
# max_write_buffer_number=6
# db_write_buffer_size=1G

# For 32GB RAM system:
# block_cache_size=8G
# write_buffer_size=512M
# max_write_buffer_number=8
# db_write_buffer_size=2G

# Compaction Configuration
level_compaction_dynamic_level_bytes=true
target_file_size_base=128M
target_file_size_multiplier=2
max_bytes_for_level_base=512M
max_bytes_for_level_multiplier=8

# Background Jobs (adjust based on CPU cores)
max_background_jobs=8
max_background_compactions=4
max_background_flushes=2

# Compression
compression=zstd
compression_per_level=none:none:zstd:zstd:zstd:zstd:zstd
zstd_max_level=9
bottommost_compression=zstd

# Bloom Filters (reduces read amplification)
bloom_bits_per_key=10
whole_key_filtering=true

# Write Performance
enable_pipelined_write=true
allow_concurrent_memtable_write=true
enable_write_thread_adaptive_yield=true

# I/O Optimization
use_direct_reads=true
use_direct_io_for_flush_and_compaction=true
bytes_per_sync=1048576
wal_bytes_per_sync=1048576
compaction_readahead_size=2097152

# File Management
max_open_files=-1
keep_log_file_num=10
max_log_file_size=100M

# WAL Configuration
wal_recovery_mode=point_in_time_recovery
wal_size_limit_mb=0
wal_ttl_seconds=0

# Statistics and Monitoring
statistics=true
stats_dump_period_sec=600
stats_persist_period_sec=600

# Advanced Tuning
level0_file_num_compaction_trigger=4
level0_slowdown_writes_trigger=20
level0_stop_writes_trigger=36
soft_pending_compaction_bytes_limit=68719476736
hard_pending_compaction_bytes_limit=274877906944

# Memory Table Configuration
memtable_prefix_bloom_size_ratio=0.1
memtable_huge_page_size=2097152

# Block-based Table Options
block_size=16384
block_restart_interval=16
index_block_restart_interval=1
metadata_block_size=4096
cache_index_and_filter_blocks=true
cache_index_and_filter_blocks_with_high_priority=true
pin_l0_filter_and_index_blocks_in_cache=true
pin_top_level_index_and_filter=true

# Rate Limiting (optional - helps with I/O spikes)
# rate_limiter_bytes_per_sec=104857600  # 100MB/s limit

# Paranoid Checks (disable in production for performance)
paranoid_checks=false

# Experimental Features (use with caution)
allow_mmap_reads=false
allow_mmap_writes=false
