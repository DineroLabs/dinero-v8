# Dinero Seed Node Configuration
# Production-grade seed node setup for network bootstrap

# Network settings
server=1
listen=1
daemon=1

# P2P Network
port=20999
maxconnections=256
dnsseed=1
onlynet=ipv4,ipv6
peerbloomfilters=1

# Enable IPv6
bind=0.0.0.0:20999
bind=[::]:20999

# RPC (localhost only for security)
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcport=20998

# Database optimization for seed nodes
dbcache=2048
maxmempool=512

# Logging for monitoring
debug=net,addrman
logips=1
shrinkdebugfile=1

# Connection management
timeout=5000
peertimeout=60
maxreceivebuffer=5000
maxsendbuffer=1000

# Bandwidth management
maxuploadtarget=0  # Unlimited for seed nodes
limitfreerelay=0

# Security
disablewallet=1  # Seed nodes don't need wallets
upnp=0
natpmp=0

# Performance tuning
par=4  # Parallel script verification
checkblocks=288
checklevel=3

# Network health
assumevalid=0  # Full validation for network integrity
