# Dinero Node Configuration
# Place this file at ~/.dinero/dinero.conf

# Node/daemon settings
server=1
listen=1
daemon=1                 # Linux only; macOS uses launchd; Windows uses service/NSSM
txindex=1                # optional, enables full transaction index

# Networking (Dinero default ports)
port=20999
rpcport=20998

# RPC: keep local only by default for security
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

# Mining (internal CPU miner)
gen=0                    # default off; users can toggle via dinero-cli
genproclimit=0           # 0 = auto-detect cores (or set N threads)

# Wallet (recommended default)
wallet=main

# Logging (optional)
# debug=net,mempool,mining
# logips=1

# Performance tuning (optional)
# maxconnections=125
# maxuploadtarget=0

# Security (uncomment for remote RPC access - NOT recommended)
# rpcauth=username:salt$hash  # generate with rpcauth.py
# rpcallowip=192.168.1.0/24   # restrict to local network
