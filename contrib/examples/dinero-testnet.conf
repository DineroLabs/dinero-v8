# Dinero Testnet Configuration
# Place this file at ~/.dinero/dinero.conf or specify with -conf=path

# Network selection
testnet=1

# Server mode (required for RPC)
server=1

# Networking
port=21000
rpcport=20998
rpcbind=127.0.0.1

# If you must allow remote RPC via VPN/jumpbox, add a single allow list (avoid 0.0.0.0/0):
# rpcallowip=10.0.0.0/16

# Seeds (replace with real DNS names when available)
# addnode=seed1.testnet.dinero.org
# addnode=seed2.testnet.dinero.org

# For testing with local nodes
# addnode=127.0.0.1:21000

# Founder control / faucet
# (Code enforces founder-control; set the faucet address here if supported by config,
# else ensure TESTNET params set it at compile-time.)
# founderpremineaddress=tdin1q...faucet

# Logging
logtimestamps=1
debug=1

# Connection limits
maxconnections=125

# Performance
dbcache=450
maxmempool=300

# Mining (optional)
# gen=1
# genproclimit=1

# Wallet
# disablewallet=0
