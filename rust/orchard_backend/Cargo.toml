[package]
name = "dinero-orchard-backend"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
orchard = "=0.15.5"
nonempty = "=0.11.0"
incrementalmerkletree = "=0.8.2"

[dev-dependencies]
rand = "=0.8.8"
rand_chacha = "=0.3.1"
sha2 = "=0.10.9"
zcash_note_encryption = "=0.4.2"

[profile.release]
panic = "unwind"
