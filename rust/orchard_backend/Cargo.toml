[package]
name = "dinero-orchard-backend"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
orchard = { version = "=0.16.0", features = ["zeroize"] }
nonempty = "=0.11.0"
incrementalmerkletree = { version = "=0.9.0", features = ["legacy-api"] }
zip32 = "=0.3.0"
zeroize = "=1.9.0"
bech32 = "=0.11.1"
rand = "=0.8.8"
rand_next = { package = "rand", version = "=0.10.3" }
rayon = "=1.12.0"
zcash_note_encryption = "=0.5.1"

[dev-dependencies]
rand_chacha = "=0.3.1"
sha2 = "=0.10.9"

[profile.release]
panic = "unwind"

[patch.crates-io]
orchard = { path = "vendor/orchard" }
