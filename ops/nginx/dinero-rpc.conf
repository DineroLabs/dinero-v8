# Dinero RPC - Production TLS Termination
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled/

upstream dinero_rpc {
    server 127.0.0.1:20998 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream dinero_ws {
    server 127.0.0.1:21001 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=rpc_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# RPC over HTTPS
server {
    listen 443 ssl http2;
    server_name rpc.dinero.example.com;
    
    # TLS Configuration
    ssl_certificate     /etc/letsencrypt/live/rpc.dinero.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpc.dinero.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/rpc.dinero.example.com/chain.pem;
    
    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
    
    # Rate limiting
    limit_req zone=rpc_limit burst=20 nodelay;
    limit_conn conn_limit 10;
    
    # Request size limits
    client_max_body_size 1M;
    client_body_timeout 10s;
    client_header_timeout 10s;
    
    # Optional: Client certificate authentication
    # ssl_client_certificate /etc/nginx/client-ca.pem;
    # ssl_verify_client optional;
    
    location / {
        # Only allow POST for RPC
        if ($request_method !~ ^(POST)$) {
            return 405;
        }
        
        # Proxy to Dinero RPC
        proxy_pass http://dinero_rpc;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Optional: Pass client cert info
        # proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        # proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
    }
    
    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Block common attack paths
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# WebSocket over HTTPS
server {
    listen 444 ssl http2;
    server_name ws.dinero.example.com;
    
    # Same TLS config as above
    ssl_certificate     /etc/letsencrypt/live/ws.dinero.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.dinero.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # Rate limiting for WebSocket
    limit_req zone=ws_limit burst=10 nodelay;
    limit_conn conn_limit 5;
    
    location /ws {
        # WebSocket proxy
        proxy_pass http://dinero_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name rpc.dinero.example.com ws.dinero.example.com;
    return 301 https://$server_name$request_uri;
}
