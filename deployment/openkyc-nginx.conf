# OpenKYC Backend - Nginx Configuration
# Place this file in: /etc/nginx/sites-available/openkyc.dinero-coin.com
# Then symlink: ln -s /etc/nginx/sites-available/openkyc.dinero-coin.com /etc/nginx/sites-enabled/

# Rate limiting zone (protects against abuse)
limit_req_zone $binary_remote_addr zone=openkyc_limit:10m rate=10r/s;

# Upstream backend (Node.js server)
upstream openkyc_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name openkyc.dinero-coin.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openkyc.dinero-coin.com;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/openkyc.dinero-coin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openkyc.dinero-coin.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/openkyc.dinero-coin.com/chain.pem;

    # SSL configuration (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS headers (for mobile wallet access)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Logging
    access_log /var/log/nginx/openkyc-access.log;
    error_log /var/log/nginx/openkyc-error.log warn;

    # API endpoints
    location /api/ {
        # Rate limiting (10 requests/second per IP)
        limit_req zone=openkyc_limit burst=20 nodelay;

        # Proxy to Node.js backend
        proxy_pass http://openkyc_backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check endpoint (no rate limiting)
    location /health {
        proxy_pass http://openkyc_backend;
        access_log off;
    }

    # Block direct access to root
    location = / {
        return 404;
    }
}
