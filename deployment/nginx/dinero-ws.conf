# Dinero WebSocket API - NGINX Reverse Proxy Configuration
# File: /etc/nginx/sites-available/dinero-ws.conf
# Symlink: ln -s /etc/nginx/sites-available/dinero-ws.conf /etc/nginx/sites-enabled/

# Upstream backend for WebSocket server
upstream dinero_ws_backend {
    server 127.0.0.1:20997;
    keepalive 64;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=ws_connect:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ws_rpc:10m rate=30r/s;

# HTTPS server (port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.dinero-coin.com;

    # SSL/TLS Configuration
    ssl_certificate /etc/letsencrypt/live/api.dinero-coin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dinero-coin.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL configuration (TLS 1.2+)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # HSTS (optional, uncomment for production)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Access logging
    access_log /var/log/nginx/dinero-ws-access.log;
    error_log /var/log/nginx/dinero-ws-error.log warn;

    # WebSocket endpoint: wss://api.dinero-coin.com/ws
    location /ws {
        # Rate limiting (10 connections per second per IP)
        limit_req zone=ws_connect burst=20 nodelay;
        limit_req zone=ws_rpc burst=50 nodelay;

        # Proxy to local WebSocket server
        proxy_pass http://dinero_ws_backend;

        # WebSocket upgrade headers (REQUIRED)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Preserve client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-lived connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;

        # Buffering (disable for real-time streaming)
        proxy_buffering off;

        # Optional: Basic authentication (uncomment if needed)
        # auth_basic "Dinero WebSocket API";
        # auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # Health check endpoint (optional)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # API documentation (optional)
    location /docs {
        alias /var/www/dinero-ws-docs;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Deny all other paths
    location / {
        return 404;
    }
}

# HTTP server (port 80) - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.dinero-coin.com;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
