[package]
name = "dinero-desktop"
version = "0.1.0"
description = "Dinero Desktop - Cross-platform GUI"
authors = ["Dinero Team"]
license = "MIT"
repository = "https://github.com/dinero/dinero"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
anyhow = "1"
thiserror = "1"
dirs = "5"
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
