# pytest.ini - Dinero Cryptocurrency Test Configuration

[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = 
    -ra
    --strict-markers
    --strict-config
    --disable-warnings
    --tb=short
    --maxfail=5

# Markers for test categorization
markers =
    basic: Basic RPC functionality tests
    websocket: WebSocket communication tests  
    mining: Mining and block generation tests
    security: Security and authentication tests
    crash: Crash recovery and persistence tests
    slow: Tests that take longer to run
    integration: Full integration tests
    asyncio: Asynchronous tests using asyncio

# Timeout configuration (requires pytest-timeout)
# timeout = 300

# Coverage configuration (requires pytest-cov)
# Uncomment to enable coverage by default
# addopts = --cov=. --cov-report=term-missing

# Logging configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Minimum Python version
minversion = 3.8

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
