<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004499;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer ring (blockchain representation) -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#blueGradient)" stroke-width="3" opacity="0.8"/>
  
  <!-- Inner circle (coin) -->
  <circle cx="32" cy="32" r="22" fill="url(#goldGradient)" stroke="url(#blueGradient)" stroke-width="2"/>
  
  <!-- Dinero "D" -->
  <path d="M 20 18 L 20 46 L 32 46 C 40 46 46 40 46 32 C 46 24 40 18 32 18 Z M 26 24 L 32 24 C 36 24 40 28 40 32 C 40 36 36 40 32 40 L 26 40 Z" 
        fill="white" stroke="url(#blueGradient)" stroke-width="1"/>
  
  <!-- Blockchain dots -->
  <circle cx="16" cy="16" r="2" fill="url(#blueGradient)" opacity="0.6"/>
  <circle cx="48" cy="16" r="2" fill="url(#blueGradient)" opacity="0.6"/>
  <circle cx="16" cy="48" r="2" fill="url(#blueGradient)" opacity="0.6"/>
  <circle cx="48" cy="48" r="2" fill="url(#blueGradient)" opacity="0.6"/>
</svg>
