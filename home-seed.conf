# Dinero Home Seed Configuration
datadir=/var/lib/dinero
daemon=1
server=1
listen=1

# P2P networking
bind=0.0.0.0:20999
port=20999
maxconnections=100

# Connect to Dinero seed nodes (update with actual Dinero seed nodes)
# addnode=seed1.dinero-coin.com:20999
# addnode=seed2.dinero-coin.com:20999

# RPC (local only)
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcport=20998

# Seed node settings
disablewallet=1
txindex=0

# Logging
logtimestamps=1
printtoconsole=1

# Storage optimization
db_cache_size_mb=512
db_compression=zstd
