# Dinero Mainnet Configuration
# Real mining configuration for production network

# Network settings
mainnet=1
server=1
daemon=1

# RPC settings
rpcport=20998
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

# P2P settings
port=20999
listen=1

# Mining settings
gen=0  # Don't auto-start mining on daemon start
genproclimit=4  # Use 4 cores for mining when enabled

# Connection settings
maxconnections=125
timeout=5000

# Logging
debug=1
printtoconsole=1

# Data directory
datadir=~/.dinero

# Performance
dbcache=300
maxmempool=300

# Security
disablewallet=0

# Seed nodes (will be updated when production servers are ready)
# addnode=seed1.dinero.org
# addnode=seed2.dinero.org
# addnode=seed3.dinero.org

# For now, mining locally until seed nodes are deployed
connect=0  # Don't connect to network yet, mine locally
